<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>HeroQuest Pro - Quests</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { 
            background: #0f172a; color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding-bottom: 80px; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { display: none; padding: 15px; text-align: center; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-view { display: block; }

        nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #1e293b; display: flex; justify-content: space-around; 
            align-items: center; border-top: 2px solid #334155; z-index: 1000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; }
        .nav-btn.active { color: #3b82f6; transform: translateY(-2px); }
        .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }
        
        /* --- MAPA --- */
        #contenedor-aventura { width: 100%; max-width: 500px; margin: auto; display: none; }
        #mapa-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 20px auto; padding: 10px; }
        .sector { aspect-ratio: 1/1; background: #020617; border: 2px solid #334155; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; position: relative; }
        .sector.revelado { background: #064e3b; border-color: #22c55e; }
        .sector.actual { border-color: #3b82f6; border-width: 3px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); transform: scale(1.08); z-index: 10; }
        .sector.completado { opacity: 0.6; background: #1e293b; border-color: #475569; }

        /* --- PUEBLO & NPC --- */
        #contenedor-pueblo { width: 100%; max-width: 600px; margin: auto; }
        .town-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .npc-list { margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; }
        
        .npc-item { 
            padding: 12px; border-bottom: 1px solid #334155; display: flex; 
            justify-content: space-between; align-items: center; cursor: pointer;
            transition: 0.2s;
        }
        .npc-item:active { background: #334155; }
        .npc-has-quest::after {
            content: "❗"; font-size: 20px; color: #fbbf24; 
            animation: bounce 1s infinite; margin-left: 10px;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        /* --- QUEST LOG --- */
        .quest-log { 
            background: rgba(15, 23, 42, 0.9); border: 1px solid #f59e0b; 
            border-radius: 8px; padding: 10px; margin: 10px auto; 
            max-width: 90%; text-align: left; font-size: 12px;
        }
        .quest-item { margin-bottom: 5px; color: #fbbf24; border-bottom: 1px dashed #451a03; padding-bottom: 4px; }
        .quest-check { color: #22c55e; font-weight: bold; margin-right: 5px; }

        /* --- COMBATE --- */
        .card { background: #1e293b; border-radius: 20px; overflow: hidden; border: 2px solid #475569; margin-top: 15px; padding-bottom: 20px; }
        .card img { width: 100%; height: auto; max-height: 45vh; object-fit: contain; background: radial-gradient(circle, #334155 0%, #000 100%); }
        .btn-action { background: #ef4444; color: white; border: none; padding: 18px; border-radius: 12px; font-weight: 900; width: 90%; margin: 10px; font-size: 18px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #991b1b; }
        .btn-win { background: #22c55e; box-shadow: 0 4px 0 #166534; }

        /* --- INVENTARIO --- */
        #lista-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 15px; padding: 15px; max-width: 550px; margin: auto; }
        .item-slot { width: 85px; height: 110px; background: #1e293b; border: 2px solid #475569; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px; cursor: pointer; box-sizing: border-box; }
        .item-slot img { width: 50px; height: 50px; object-fit: contain; }
        
        .btn-aventura { width: 90%; background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); color: white; border: none; padding: 20px; font-size: 18px; font-weight: bold; border-radius: 15px; margin-top: 20px; cursor: pointer; box-shadow: 0 4px 0 #7c2d12; text-transform: uppercase; }
        
        /* Modal simple para diálogo */
        #modal-dialogo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 15px; border: 2px solid #fbbf24; max-width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div id="modal-dialogo">
        <div class="modal-content">
            <h2 id="modal-titulo" style="color:#fbbf24"></h2>
            <p id="modal-texto" style="color:#e2e8f0; font-size: 16px; margin: 20px 0;"></p>
            <div id="modal-botones" style="display:flex; gap:10px; justify-content:center;"></div>
        </div>
    </div>

    <section id="vista-mundo" class="tab-content active-view">
        
        <div id="contenedor-pueblo">
            <div class="town-header">
                <h2 style="color: #fbbf24; margin: 5px 0; font-size: 28px;" id="pueblo-nombre"></h2>
                <div id="quest-log-pueblo" class="quest-log" style="display:none;"></div>
            </div>

            <h3 style="font-size: 14px; color: #94a3b8; text-align: left; margin-left: 10px;">👥 HABITANTES (MISIONES)</h3>
            <div class="npc-list" id="lista-npcs"></div>

            <button class="btn-aventura" onclick="irDeAventura()">💀 IR DE AVENTURA</button>
        </div>

        <div id="contenedor-aventura">
            <h2 style="color: #22c55e; font-style: italic;">EXPLORANDO...</h2>
            <div id="quest-log-mapa" class="quest-log" style="display:none;"></div>
            <div id="mapa-grid"></div>
            <button class="btn-action btn-back" style="background: #334155; box-shadow: 0 4px 0 #1e293b;" onclick="volverAlPueblo()">🏳️ HUIR AL PUEBLO</button>
        </div>

        <div id="pantalla-enemigo" style="display: none;">
            <div class="card">
                <img id="enemigo-img" src="" alt="Enemigo">
                <div style="padding: 15px;">
                    <h3 id="enemigo-nombre" style="margin: 5px 0; font-size: 24px; color: #f87171;"></h3>
                    <p style="color: #94a3b8;">Vida: <span id="enemigo-hp" style="color: #ef4444; font-weight: bold;"></span></p>
                </div>
                <button id="btn-derrota" class="btn-action btn-win" onclick="derrotarEnemigo()">⚔️ ATACAR</button>
                <div id="botin-texto" style="padding: 20px; color: #fbbf24; font-weight: bold; min-height: 50px;"></div>
                <button class="btn-action btn-back" onclick="cerrarCombate()">CONTINUAR</button>
            </div>
        </div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308;">INVENTARIO</h2>
        <div id="lista-inv"></div>
        <button class="btn-action" style="background:#334155; box-shadow:none; margin-top:20px" onclick="borrarTodo()">⚠️ RESET TOTAL</button>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6;">HÉROE</h2>
        <p style="color:#94a3b8">Equipamiento (Próximamente stats reales)</p>
        <div id="lista-equipo" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; max-width:300px; margin:auto;"></div>
    </section>

    <nav>
        <button class="nav-btn active" id="btn-nav-mundo" onclick="cambiarVista('mundo')"><span>🌍</span>MUNDO</button>
        <button class="nav-btn" id="btn-nav-heroe" onclick="cambiarVista('heroe')"><span>🛡️</span>HÉROE</button>
        <button class="nav-btn" id="btn-nav-mochila" onclick="cambiarVista('mochila')"><span>🎒</span>MOCHILA</button>
    </nav>

    <script>
        // --- ESTADO Y DATOS ---
        const prefijosPueblo = ["Val", "Roca", "Bosque", "Puerto", "Villa", "Fuerte"];
        const sufijosPueblo = ["mar", "luz", "sombra", "frio", "verde", "alta"];
        const nombresNPC = ["Borg", "Ana", "Thorin", "Elena", "Grom", "Syla"];
        const oficiosNPC = ["Herrero", "Mercader", "Guardia", "Mago", "Granjero"];
        
        let enemigos = [];
        let itemsDB = {};
        let inventario = safeParse('hq_inv', []);
        let puebloActual = safeParse('hq_pueblo', null);
        let questsActivas = safeParse('hq_quests', []); // Lista de misiones activas
        
        // Variables de sesión (no se guardan)
        let modoAventura = false;
        let enCombate = false;
        let mundo = { dimension: 3, sectores: [], pos: { x: 1, y: 1 } };
        let enemigoActual = null;
        let esJefe = false;

        function safeParse(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
        function saveAll() {
            localStorage.setItem('hq_inv', JSON.stringify(inventario));
            localStorage.setItem('hq_quests', JSON.stringify(questsActivas));
            localStorage.setItem('hq_pueblo', JSON.stringify(puebloActual));
        }

        function getPath(item) {
            if (!item || !item.f) return "img/error.jpg";
            return item.f.includes('/') ? `img/${item.f}` : `img/${item.subfolder}/${item.f}`;
        }

        // --- SISTEMA DE MISIONES ---
        function generarMisionRandom(npcName) {
            const tipos = ["caza", "exploracion", "recoleccion", "jefe"];
            const tipo = tipos[Math.floor(Math.random() * tipos.length)];
            let q = { id: Date.now() + Math.random(), npc: npcName, tipo: tipo, progreso: 0, meta: 1, desc: "", completada: false };

            if (tipo === "caza") {
                q.meta = 3 + Math.floor(Math.random() * 3);
                q.desc = `Derrota a ${q.meta} enemigos en el bosque.`;
            } else if (tipo === "exploracion") {
                q.meta = 5;
                q.desc = `Explora ${q.meta} sectores del mapa.`;
            } else if (tipo === "recoleccion") {
                // Buscamos un objeto basura aleatorio
                const basuraItems = Object.values(itemsDB).filter(i => i.subfolder === 'basura');
                if (basuraItems.length > 0) {
                    const targetItem = basuraItems[Math.floor(Math.random() * basuraItems.length)];
                    q.targetId = targetItem.n; // Usamos nombre por simplicidad
                    q.desc = `Tráeme: ${targetItem.n}`;
                } else {
                    q.tipo = "caza"; q.meta = 2; q.desc = "Elimina 2 enemigos."; // Fallback
                }
            } else if (tipo === "jefe") {
                q.desc = "Derrota al JEFE de la zona (última casilla).";
            }
            return q;
        }

        function checkMisiones(accion, cantidad = 1, extraData = null) {
            let huboCambios = false;
            questsActivas.forEach(q => {
                if (q.completada) return;

                if (accion === "matar" && q.tipo === "caza") {
                    q.progreso += cantidad;
                } 
                else if (accion === "explorar" && q.tipo === "exploracion") {
                    q.progreso += cantidad;
                }
                else if (accion === "matar_jefe" && q.tipo === "jefe") {
                    q.progreso = 1;
                }
                else if (accion === "check_inv" && q.tipo === "recoleccion") {
                    const tieneItem = inventario.some(i => i.n === q.targetId);
                    if (tieneItem) q.progreso = 1;
                    else q.progreso = 0;
                }

                // Verificar completado
                if (q.progreso >= q.meta) {
                    q.progreso = q.meta;
                    if (!q.completada && accion !== "check_inv") { // Evitar spam en check_inv
                        // alert("¡Misión Completada: " + q.desc + "!"); // Opcional
                    }
                    q.completada = true;
                }
                huboCambios = true;
            });
            if (huboCambios) {
                saveAll();
                renderQuestLog();
            }
        }

        function renderQuestLog() {
            const html = questsActivas.map(q => `
                <div class="quest-item">
                    ${q.completada ? '<span class="quest-check">✔</span>' : '<span>⚔</span>'} 
                    ${q.desc} <span style="color:#94a3b8">(${q.progreso}/${q.meta})</span>
                </div>
            `).join('');
            
            const logPueblo = document.getElementById('quest-log-pueblo');
            const logMapa = document.getElementById('quest-log-mapa');
            
            if (questsActivas.length > 0) {
                logPueblo.innerHTML = "<b>📜 MISIONES ACTIVAS:</b>" + html;
                logMapa.innerHTML = "<b>📜 OBJETIVOS:</b>" + html;
                logPueblo.style.display = 'block';
                logMapa.style.display = 'block';
            } else {
                logPueblo.style.display = 'none';
                logMapa.style.display = 'none';
            }
        }

        // --- INTERACCIÓN NPC ---
        function abrirDialogoNPC(index) {
            const npc = puebloActual.npcs[index];
            const modal = document.getElementById('modal-dialogo');
            const titulo = document.getElementById('modal-titulo');
            const texto = document.getElementById('modal-texto');
            const btns = document.getElementById('modal-botones');

            modal.style.display = 'flex';
            titulo.innerText = npc.n + " (" + npc.job + ")";
            btns.innerHTML = "";

            // Lógica de Misión
            const misionActivaNPC = questsActivas.find(q => q.npc === npc.n);

            if (misionActivaNPC) {
                if (misionActivaNPC.completada) {
                    texto.innerText = "¡Increíble! Has completado lo que te pedí. Aquí tienes tu recompensa.";
                    btns.innerHTML = `<button class="btn-action btn-win" onclick="entregarMision('${npc.n}')">🎁 RECIBIR RECOMPENSA</button>`;
                } else {
                    texto.innerText = `Aún estoy esperando: "${misionActivaNPC.desc}"`;
                    btns.innerHTML = `<button class="btn-action" style="background:#334155" onclick="cerrarModal()">Vale, sigo en ello</button>`;
                }
            } else if (npc.questDisponible) {
                texto.innerText = "¡Eh, tú! Pareces fuerte. Tengo un trabajo para ti.";
                // Crear botón aceptar que pasa el objeto quest completo (stringify para pasar por onclick)
                // Truco: guardamos la quest temporal en una variable global para aceptarla
                window.tempQuest = npc.questDisponible; 
                btns.innerHTML = `
                    <button class="btn-action btn-win" onclick="aceptarMision(${index})">ACEPTAR</button>
                    <button class="btn-action" style="background:#64748b" onclick="cerrarModal()">RECHAZAR</button>
                `;
            } else {
                const frases = ["Bonito día para morir.", "¿Has visto mis herramientas?", "Cuidado con el bosque.", "Compraría tus cosas si tuviera oro."];
                texto.innerText = frases[Math.floor(Math.random() * frases.length)];
                btns.innerHTML = `<button class="btn-action" style="background:#334155" onclick="cerrarModal()">Adiós</button>`;
            }
        }

        function aceptarMision(npcIndex) {
            const npc = puebloActual.npcs[npcIndex];
            if (npc.questDisponible) {
                questsActivas.push(npc.questDisponible);
                npc.questDisponible = null; // Quitar la misión del NPC
                saveAll();
                renderPueblo(); // Actualizar iconos
                renderQuestLog();
                cerrarModal();
                // Check inicial por si es de recolección y ya tenemos el objeto
                checkMisiones("check_inv");
            }
        }

        function entregarMision(npcName) {
            // Borrar misión y dar reward
            questsActivas = questsActivas.filter(q => q.npc !== npcName);
            
            // Recompensa simple: Objeto aleatorio
            const pool = Object.values(itemsDB).filter(i => i.Rareza !== 'Poor');
            if(pool.length > 0) {
                const reward = pool[Math.floor(Math.random() * pool.length)];
                inventario.push({...reward});
                alert(`¡Has recibido: ${reward.n}!`);
            }
            
            saveAll();
            renderPueblo();
            renderQuestLog();
            cerrarModal();
        }

        function cerrarModal() { document.getElementById('modal-dialogo').style.display = 'none'; }


        // --- SISTEMA PUEBLO ---
        function generarPoblacion() {
            const nombre = prefijosPueblo[Math.floor(Math.random()*prefijosPueblo.length)] + " " + sufijosPueblo[Math.floor(Math.random()*sufijosPueblo.length)];
            let habitantes = [];
            for(let i=0; i<6; i++) {
                let npc = {
                    n: nombresNPC[Math.floor(Math.random() * nombresNPC.length)],
                    job: oficiosNPC[Math.floor(Math.random() * oficiosNPC.length)],
                    questDisponible: null
                };
                // 30% Probabilidad de tener misión
                if (Math.random() < 0.4) {
                    npc.questDisponible = generarMisionRandom(npc.n);
                }
                habitantes.push(npc);
            }
            puebloActual = { nombre: nombre, npcs: habitantes };
            saveAll();
        }

        function renderPueblo() {
            if (!puebloActual) generarPoblacion();
            document.getElementById('pueblo-nombre').innerText = puebloActual.nombre;
            const lista = document.getElementById('lista-npcs');
            lista.innerHTML = "";
            
            puebloActual.npcs.forEach((npc, i) => {
                // Verificar si este NPC tiene una misión activa CON NOSOTROS
                const tieneActiva = questsActivas.some(q => q.npc === npc.n);
                // Tiene quest disponible para dar O tiene una activa pendiente
                const showIcon = (npc.questDisponible !== null) || (tieneActiva && questsActivas.find(q => q.npc === npc.n).completada);
                const classQuest = showIcon ? "npc-has-quest" : "";
                
                let statusText = npc.job;
                if (tieneActiva) statusText = "Esperando resultados...";

                lista.innerHTML += `
                    <div class="npc-item ${classQuest}" onclick="abrirDialogoNPC(${i})">
                        <div>
                            <span style="font-weight:bold; font-size:16px; color:#e2e8f0">${npc.n}</span>
                            <br><span style="font-size:12px; color:#94a3b8">${statusText}</span>
                        </div>
                        <div style="font-size:20px">💬</div>
                    </div>`;
            });
            renderQuestLog();
        }

        // --- AVENTURA ---
        function irDeAventura() {
            modoAventura = true;
            enCombate = false;
            initMapa();
            cambiarVista('mundo');
        }

        function initMapa() {
            mundo.sectores = [];
            mundo.pos = { x: 1, y: 1 }; 
            for (let x = 0; x < mundo.dimension; x++) {
                mundo.sectores[x] = [];
                for (let y = 0; y < mundo.dimension; y++) {
                    mundo.sectores[x][y] = { revelado: (x===1 && y===1), completado: false };
                }
            }
            renderMapa();
            renderQuestLog();
        }

        function renderMapa() {
            const grid = document.getElementById('mapa-grid');
            grid.innerHTML = "";
            for (let y = 0; y < mundo.dimension; y++) {
                for (let x = 0; x < mundo.dimension; x++) {
                    const s = mundo.sectores[x][y];
                    const esActual = (x === mundo.pos.x && y === mundo.pos.y);
                    const div = document.createElement('div');
                    div.className = `sector ${s.revelado ? 'revelado' : ''} ${esActual ? 'actual' : ''} ${s.completado ? 'completado' : ''}`;
                    
                    if (s.revelado) {
                        if (esActual) div.innerHTML = "🛡️";
                        else if (s.completado) div.innerHTML = "🌲";
                        else div.innerHTML = (x===2 && y===2) ? "💀" : "❓"; // Marcamos el jefe al final si se revela
                    } else {
                        div.innerHTML = "☁️"; 
                    }
                    div.onclick = () => clicarSector(x, y);
                    grid.appendChild(div);
                }
            }
        }

        function clicarSector(x, y) {
            const dist = Math.abs(x - mundo.pos.x) + Math.abs(y - mundo.pos.y);
            
            // Si clicamos donde estamos, peleamos
            if (x === mundo.pos.x && y === mundo.pos.y) {
                if (!mundo.sectores[x][y].completado) {
                    esJefe = (x === 2 && y === 2); // Última casilla es jefe
                    mostrarCombate();
                }
                return;
            }
            
            // Movimiento
            if (dist === 1) {
                mundo.pos = { x, y };
                if (!mundo.sectores[x][y].revelado) {
                    mundo.sectores[x][y].revelado = true;
                    checkMisiones("explorar");
                }
                renderMapa();
            }
        }

        // --- COMBATE ---
        function mostrarCombate() {
            enCombate = true;
            if (enemigos.length === 0) return;
            
            // Si es Jefe, buscamos uno fuerte o lo simulamos
            if (esJefe) {
                enemigoActual = { ...enemigos[enemigos.length - 1] }; // El último de la lista suele ser fuerte
                enemigoActual.n = "JEFE " + enemigoActual.n;
                enemigoActual.hp = parseInt(enemigoActual.hp) * 2;
            } else {
                enemigoActual = { ...enemigos[Math.floor(Math.random() * enemigos.length)] };
            }

            document.getElementById('enemigo-nombre').innerText = enemigoActual.n;
            document.getElementById('enemigo-hp').innerText = enemigoActual.hp;
            document.getElementById('enemigo-img').src = getPath(enemigoActual);
            
            document.getElementById('btn-derrota').style.display = 'inline-block';
            document.getElementById('botin-texto').innerHTML = "";
            
            cambiarVista('mundo');
        }

        function derrotarEnemigo() {
            // Lógica de botín simple
            if (inventario.length < 20) {
                const loot = Object.values(itemsDB)[Math.floor(Math.random() * Object.values(itemsDB).length)];
                if(loot) {
                    inventario.push({...loot});
                    document.getElementById('botin-texto').innerHTML = `Obtenido: ${loot.n}`;
                    saveAll();
                }
            } else {
                 document.getElementById('botin-texto').innerHTML = "Mochila llena...";
            }

            // Actualizar Misiones
            checkMisiones("matar");
            if (esJefe) checkMisiones("matar_jefe");
            checkMisiones("check_inv"); // Por si dropeamos item de quest

            document.getElementById('btn-derrota').style.display = 'none';
            mundo.sectores[mundo.pos.x][mundo.pos.y].completado = true;
        }

        function cerrarCombate() {
            enCombate = false;
            renderMapa();
            cambiarVista('mundo');
        }

        function volverAlPueblo() {
            modoAventura = false;
            enCombate = false;
            cambiarVista('mundo');
        }

        // --- UI AUXILIAR ---
        function cambiarVista(donde) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-' + donde).classList.add('active-view');
            document.getElementById('btn-nav-' + donde).classList.add('active');
            
            if(donde === 'mundo') {
                if(modoAventura) {
                    document.getElementById('contenedor-pueblo').style.display = 'none';
                    if(enCombate) {
                        document.getElementById('contenedor-aventura').style.display = 'none';
                        document.getElementById('pantalla-enemigo').style.display = 'block';
                    } else {
                        document.getElementById('contenedor-aventura').style.display = 'block';
                        document.getElementById('pantalla-enemigo').style.display = 'none';
                    }
                } else {
                    document.getElementById('contenedor-pueblo').style.display = 'block';
                    document.getElementById('contenedor-aventura').style.display = 'none';
                    document.getElementById('pantalla-enemigo').style.display = 'none';
                    renderPueblo();
                }
            }
            if(donde === 'mochila') renderInv();
        }

        function renderInv() {
            const div = document.getElementById('lista-inv');
            div.innerHTML = "";
            inventario.forEach(item => {
                div.innerHTML += `<div class="item-slot"><img src="${getPath(item)}"><span style="font-size:9px">${item.n}</span></div>`;
            });
        }
        
        function borrarTodo() {
            localStorage.clear();
            location.reload();
        }

        // CARGA
        async function init() {
            const v = Date.now();
            try {
                const [en, it1, it2, it3] = await Promise.all([
                    fetch('enemigos.json?v='+v).then(r=>r.json()),
                    fetch('equipacion.json?v='+v).then(r=>r.json()),
                    fetch('consumibles.json?v='+v).then(r=>r.json()),
                    fetch('basura.json?v='+v).then(r=>r.json())
                ]);
                
                Object.values(it1).forEach(i=>i.subfolder="equipacion");
                Object.values(it2).forEach(i=>i.subfolder="consumibles");
                Object.values(it3).forEach(i=>i.subfolder="basura");
                Object.values(en).forEach(e=>e.subfolder="enemigos");

                enemigos = Object.values(en);
                itemsDB = { ...it1, ...it2, ...it3 };

                if (!puebloActual) generarPoblacion();
                renderPueblo();
                
            } catch (e) { console.error(e); alert("Error cargando JSONs"); }
        }
        init();

    </script>
</body>
</html>
