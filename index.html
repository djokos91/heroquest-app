<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>HeroQuest Pro - Final Edition</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { 
            display: none; 
            padding: 15px; 
            text-align: center; 
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-view { display: block; }

        nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #1e293b; display: flex; justify-content: space-around; 
            align-items: center; border-top: 2px solid #334155; z-index: 1000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn { 
            background: none; border: none; color: #94a3b8; 
            font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; 
            transition: all 0.2s;
        }
        .nav-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-btn.active { color: #3b82f6; transform: translateY(-2px); }
        .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }
        
        /* --- MONEDERO --- */
        .wallet-container {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #fbbf24;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .gold-icon { font-size: 20px; }
        .gold-amount { color: #fbbf24; font-weight: bold; font-size: 18px; font-family: 'Courier New', Courier, monospace; }

        /* --- ANIMACIONES DE RESALTADO --- */
        .sector:hover, .edificio-card:hover, .item-slot:hover, .slot:hover, .npc-item:hover {
            transform: scale(1.03);
            border-color: #3b82f6 !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        /* --- MAPA Y PUEBLO --- */
        #contenedor-aventura { width: 100%; max-width: 500px; margin: auto; display: none; }
        #mapa-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 20px auto; padding: 10px; }
        .sector { aspect-ratio: 1/1; background: #020617; border: 2px solid #334155; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; }
        .sector.revelado { background: #064e3b; border-color: #22c55e; }
        .sector.actual { border-color: #3b82f6; border-width: 3px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); transform: scale(1.08); z-index: 10; }

        .npc-item { padding: 12px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 8px; }
        .quest-mark { font-weight: bold; font-size: 22px; animation: bounce 1s infinite; }
        .mark-available { color: #fbbf24; }
        .mark-ready { color: #22c55e; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- FICHA Y SLOTS --- */
        .hero-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 480px; margin: auto; padding: 15px; background: rgba(15, 23, 42, 0.5); border-radius: 20px; }
        .slot { width: 54px; height: 54px; background: rgba(30, 41, 59, 0.9); border: 2px solid #475569; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .slot img { width: 85%; height: 85%; object-fit: contain; z-index: 2; }
        .slot::after { content: attr(data-label); position: absolute; bottom: 0; font-size: 7px; color: #94a3b8; text-transform: uppercase; width: 100%; text-align: center; background: rgba(0,0,0,0.8); z-index: 1; }
        .silhouette { font-size: 120px; opacity: 0.05; display: flex; align-items: center; justify-content: center; }

        .item-slot { width: 85px; height: 110px; background: #1e293b; border: 2px solid #475569; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px; cursor: pointer; box-sizing: border-box; }
        .item-slot img { width: 50px; height: 50px; object-fit: contain; }
        
        .btn-action { background: #ef4444; color: white; border: none; padding: 18px; border-radius: 12px; font-weight: 900; width: 90%; margin: 10px; font-size: 18px; cursor: pointer; text-transform: uppercase; }
        .btn-aventura { width: 90%; background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); color: white; border: none; padding: 20px; font-size: 18px; border-radius: 15px; margin-top: 20px; cursor: pointer; box-shadow: 0 4px 0 #7c2d12; }
    </style>
</head>
<body>

    <section id="vista-mundo" class="tab-content active-view">
        <div id="contenedor-pueblo">
            <h2 id="pueblo-nombre" style="color: #fbbf24;"></h2>
            <div class="edificios-grid" id="lista-edificios"></div>
            <h3 style="text-align: left; margin-left: 10px; color: #94a3b8;">👥 HABITANTES</h3>
            <div class="npc-list" id="lista-npcs"></div>
            <button class="btn-aventura" onclick="irDeAventura()">💀 SALIR DE AVENTURA</button>
        </div>

        <div id="contenedor-aventura">
            <h2 style="color: #22c55e;">BOSQUE OSCURO</h2>
            <div id="mapa-grid"></div>
            <button class="btn-action" style="background: #334155;" onclick="volverAlPueblo()">🏳️ HUIR</button>
        </div>

        <div id="pantalla-enemigo" style="display: none;">
            <div id="botin-texto" style="padding: 20px; min-height: 150px;"></div>
            <button id="btn-derrota" class="btn-action" style="background: #22c55e;" onclick="derrotarEnemigo()">⚔️ VICTORIA</button>
            <button class="btn-action" onclick="cerrarCombate()">VOLVER</button>
        </div>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6;">HÉROE</h2>
        
        <div class="wallet-container">
            <span class="gold-icon">💰</span>
            <span id="oro-valor" class="gold-amount">0</span>
        </div>

        <div class="hero-container">
            <div class="slot-column">
                <div id="slot-cabeza" class="slot" data-label="Cabeza" onclick="gestionarEquipado(this)"></div>
                <div id="slot-cuello" class="slot" data-label="Cuello" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pecho" class="slot" data-label="Pecho" onclick="gestionarEquipado(this)"></div>
            </div>
            <div class="silhouette">👤</div>
            <div class="slot-column">
                <div id="slot-anillo-1" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pies" class="slot" data-label="Pies" onclick="gestionarEquipado(this)"></div>
                <div id="slot-mano1" class="slot" data-label="Mano 1" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>

        <div style="margin: 15px auto; display: flex; gap: 8px; justify-content: center;">
             <div id="slot-bolsa-1" class="slot" data-label="Base" onclick="gestionarEquipado(this)"></div>
             <div id="slot-bolsa-2" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
             <div id="slot-bolsa-3" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
        </div>

        <div id="quest-log-container" class="quest-log" style="text-align: left; background: #1e293b; padding: 15px; border-radius: 15px; margin-top: 20px; border: 1px solid #334155;"></div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308;">INVENTARIO</h2>
        <div id="lista-inv"></div>
        <button class="btn-action" onclick="borrarTodo()">⚠️ RESET</button>
    </section>

    <nav>
        <button class="nav-btn active" id="btn-nav-mundo" onclick="cambiarVista('mundo')"><span>🌍</span>MUNDO</button>
        <button class="nav-btn" id="btn-nav-heroe" onclick="cambiarVista('heroe')"><span>🛡️</span>HÉROE</button>
        <button class="nav-btn" id="btn-nav-mochila" onclick="cambiarVista('mochila')"><span>🎒</span>MOCHILA</button>
    </nav>

    <script>
        const coloresRareza = { "Poor": "#9d9d9d", "Common": "#ffffff", "Uncommon": "#1eff00", "Rare": "#0070dd", "Epic": "#a335ee", "Legendary": "#ff8000" };
        
        // --- BASE DE DATOS MISIONES ---
        const dbMisiones = [
            { id: "m1", n: "Cacería", desc: "Mata 3 bichos.", tipo: "kill", meta: 3, recompensa: "espada_corta", oro: 50 },
            { id: "m2", n: "Exploración", desc: "Ve a (2,2).", tipo: "go", meta: 1, coord: {x:2,y:2}, recompensa: "pocion_vida", oro: 100 }
        ];

        let enemigos = [], itemsDB = {};
        let inventario = safeParse('hq_inv', []);
        let equipado = safeParse('hq_equipo', {});
        let misionesActivas = safeParse('hq_quests', []);
        let misionesCompletadas = safeParse('hq_quests_done', []);
        let oro = safeParse('hq_oro', 0);
        let puebloActual = null, modoAventura = false, enCombate = false;
        let mundo = { sectores: [], pos: { x: 1, y: 1 } };

        function safeParse(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } }
        function getPath(it) { return it && it.f ? (it.f.includes('/') ? `img/${it.f}` : `img/${it.subfolder}/${it.f}`) : "img/error.jpg"; }

        function hablarConNPC(idx) {
            const npc = puebloActual.npcs[idx];
            const qHecha = misionesActivas.find(q => q.owner === npc.n && q.completada);
            
            if (qHecha) {
                alert(`¡Gracias! Aquí tienes ${qHecha.oro} de oro y un regalo.`);
                oro += qHecha.oro || 0;
                if(qHecha.recompensa) inventario.push({...itemsDB[qHecha.recompensa]});
                misionesCompletadas.push(qHecha.id);
                misionesActivas = misionesActivas.filter(q => q.id !== qHecha.id);
                guardarYActualizar();
                return;
            }

            if (npc.misionId && !misionesCompletadas.includes(npc.misionId) && !misionesActivas.some(q => q.id === npc.misionId)) {
                const mData = dbMisiones.find(m => m.id === npc.misionId);
                if (confirm(`${npc.n}: "${mData.desc}" ¿Aceptas?`)) {
                    misionesActivas.push({...mData, actual: 0, completada: false, owner: npc.n});
                    guardarYActualizar();
                }
            } else { alert(`${npc.n}: "Hola, viajero."`); }
        }

        function guardarYActualizar() {
            localStorage.setItem('hq_inv', JSON.stringify(inventario));
            localStorage.setItem('hq_equipo', JSON.stringify(equipado));
            localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
            localStorage.setItem('hq_quests_done', JSON.stringify(misionesCompletadas));
            localStorage.setItem('hq_oro', oro);
            renderPueblo();
            actualizarUIOro();
        }

        function actualizarUIOro() {
            const el = document.getElementById('oro-valor');
            if(el) el.innerText = oro;
        }

        function renderPueblo() {
            if (!puebloActual) generarPueblo();
            document.getElementById('pueblo-nombre').innerText = puebloActual.nombre;
            const gN = document.getElementById('lista-npcs');
            gN.innerHTML = puebloActual.npcs.map((npc, idx) => {
                const qReady = misionesActivas.some(q => q.owner === npc.n && q.completada);
                const qDisp = npc.misionId && !misionesCompletadas.includes(npc.misionId) && !misionesActivas.some(q => q.id === npc.misionId);
                
                let mark = "";
                if(qReady) mark = '<span class="quest-mark mark-ready">❓</span>';
                else if(qDisp) mark = '<span class="quest-mark mark-available">❗</span>';

                return `<div class="npc-item" onclick="hablarConNPC(${idx})">
                    <div><b>${npc.n}</b><br><small>${npc.job}</small></div>
                    ${mark}
                </div>`;
            }).join("");
        }

        function renderEquipado() {
            document.querySelectorAll('.slot').forEach(s => { if(s.id !== 'slot-bolsa-1') s.innerHTML = ""; s.style.borderColor = "#475569"; });
            
            // MOCHILA BASE (Corregida opacidad)
            const b1 = document.getElementById('slot-bolsa-1');
            if(b1) b1.innerHTML = `<img src="img/equipacion/mochila.jpg" style="opacity:1">`;

            for (const sId in equipado) {
                const it = equipado[sId];
                const target = document.getElementById(sId);
                if (target && it) {
                    target.innerHTML = `<img src="${getPath(it)}">`;
                    target.style.borderColor = coloresRareza[it.Rareza] || "#475569";
                }
            }
        }

        function derrotarEnemigo() {
            const it = { ...Object.values(itemsDB)[Math.floor(Math.random()*Object.values(itemsDB).length)] };
            inventario.push(it);
            oro += 10; // Oro por matar
            misionesActivas.forEach(q => { if(q.tipo === "kill") q.actual++; if(q.actual >= q.meta) q.completada = true; });
            
            document.getElementById('botin-texto').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <span style="color: #fbbf24; font-weight: bold;">✨ BOTÍN ✨</span>
                    <img src="${getPath(it)}" style="width: 60px; height: 60px; border: 3px solid ${coloresRareza[it.Rareza]}; border-radius: 10px;">
                    <span style="color: ${coloresRareza[it.Rareza]}">${it.n}</span>
                    <span style="color: #fbbf24">+10 Oro 💰</span>
                </div>`;
            document.getElementById('btn-derrota').style.display = 'none';
            guardarYActualizar();
        }

        function generarPueblo() {
            puebloActual = { nombre: "Rocanegra", npcs: [{n: "Thorin", job: "Herrero", misionId: "m1"}, {n: "Elena", job: "Guía", misionId: "m2"}] };
        }

        function cambiarVista(d) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-'+d).classList.add('active-view');
            document.getElementById('btn-nav-'+d).classList.add('active');
            if(d === 'heroe') { renderEquipado(); actualizarUIOro(); }
            if(d === 'mundo') renderPueblo();
        }

        async function cargarDatos() {
            try {
                const [rEn, rEq, rCo] = await Promise.all([
                    fetch(`enemigos.json?v=1`).then(r => r.json()).catch(()=>({})),
                    fetch(`equipacion.json?v=1`).then(r => r.json()).catch(()=>({})),
                    fetch(`consumibles.json?v=1`).then(r => r.json()).catch(()=>({}))
                ]);
                Object.values(rEq).forEach(i=>i.subfolder="equipacion");
                Object.values(rCo).forEach(i=>i.subfolder="consumibles");
                enemigos = Object.values(rEn); enemigos.forEach(e=>e.subfolder="enemigos");
                itemsDB = {...rEq, ...rCo};
                renderPueblo();
            } catch(e) {}
        }

        function irDeAventura() { modoAventura = true; initMapa(); cambiarVista('mundo'); }
        function volverAlPueblo() { modoAventura = false; cambiarVista('mundo'); }
        function initMapa() { mundo.pos = {x:1,y:1}; renderMapa(); }
        function renderMapa() { /* Similar al anterior */ }
        function borrarTodo() { localStorage.clear(); location.reload(); }

        cargarDatos();
    </script>
</body>
</html>
