    <style>
    /* Estilo Edificios -------------------------------------------------------*/
.edificios-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
}

.edificio-card {
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 8px;
    padding: 10px;
    width: 90px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.edificio-card:hover {
    border-color: #fbbf24;
    transform: translateY(-2px);
}

.npc-list {
    background: rgba(30, 41, 59, 0.5);
    border-radius: 8px;
    margin: 10px;
}
        /* Clase para resaltar el slot seleccionado----------------------------------------------- */
.item-slot.selected { border-color: #ef4444 !important; /* Rojo */
    background: rgba(239, 68, 68, 0.2);
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    transform: scale(0.95);
}

/* Animación para el botón de selección cuando está activo */
.btn-multi-select.active {
    background: #ef4444 !important;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
}
        .item-slot img:active { cursor: grabbing; opacity: 0.5; }
        .filter-btn { background: #334155; border: 1px solid #475569; color: white; border-radius: 4px; transition: all 0.2s; cursor: pointer; display: block; }
        .filter-btn:hover { background: #3b82f6; }
        /* Estilo cuando el botón está ACTIVO */
        .filter-btn.active { background: #3b82f6; color: white; border-color: #60a5fa; box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); font-weight: bold; }
        .item-slot.empty { background: rgba(0,0,0,0.1); border: 1px dashed #334155; }
        /* --- ESTILOS GENERALES (TUS ORIGINALES) --- */
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { 
            display: none; 
            padding: 15px; 
            text-align: center; 
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-view { display: block !important; }

        nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #1e293b; display: flex; justify-content: space-around; 
            align-items: center; border-top: 2px solid #334155; z-index: 1000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn { 
            background: none; border: none; color: #94a3b8; 
            font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; 
            transition: all 0.2s;
        }
        .nav-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-btn.active { color: #3b82f6; transform: translateY(-2px); }
        .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }
        
        /* --- ANIMACIONES Y HOVER (TUS ORIGINALES REINSTAURADAS) --- */
        .sector:hover, .edificio-card:hover, .item-slot:hover, .slot:hover, .npc-item:hover {
            transform: scale(1.03);
            border-color: #3b82f6 !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            z-index: 5;
            transition: all 0.2s ease;
        }

        /* --- SISTEMA DE MAPA --- */
        #contenedor-aventura { width: 100%; max-width: 500px; margin: auto; display: none; }
        #mapa-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; max-width: 320px; margin: 20px auto; padding: 10px;
        }
        .sector {
            aspect-ratio: 1/1; background: #020617; border: 2px solid #334155;
            border-radius: 15px; display: flex; align-items: center;
            justify-content: center; font-size: 32px; cursor: pointer; position: relative;
        }
        .sector.revelado { background: #064e3b; border-color: #22c55e; }
        .sector.actual { 
            border-color: #3b82f6; border-width: 3px; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); transform: scale(1.08); z-index: 10; 
        }
        .sector.completado { opacity: 0.6; background: #1e293b; border-color: #475569; }

        /* --- PUEBLO Y NPCs --- */
        #contenedor-pueblo { width: 100%; max-width: 600px; margin: auto; position: relative; }
        .town-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .town-type { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 3px; }
        
        /* BOTÓN DE NUEVA POBLACIÓN */
        .btn-refundar {
            position: absolute; top: 0; right: 0;
            background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444;
            padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 10px;
        }

        .edificios-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px; padding: 10px;
        }
        .edificio-card {
            background: #1e293b; border: 1px solid #475569; border-radius: 12px;
            padding: 15px 5px; cursor: pointer;
        }
        .edificio-icon { font-size: 30px; display: block; margin-bottom: 5px; }
        .edificio-name { font-size: 12px; font-weight: bold; color: #e2e8f0; }

        .npc-list { margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; }
        .npc-item { 
            padding: 12px; border-bottom: 1px solid #334155; display: flex; 
            justify-content: space-between; align-items: center; cursor: pointer;
            border-radius: 8px;
        }
        .npc-item:last-child { border-bottom: none; }
        .npc-role { font-size: 10px; color: #94a3b8; text-transform: uppercase; background: #0f172a; padding: 2px 6px; border-radius: 4px; }
        
        .quest-mark { font-weight: bold; font-size: 20px; animation: bounce 1s infinite; }
        .quest-available { color: #fbbf24; }
        .quest-ready { color: #22c55e; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- MONEDERO MULTIDIVISA --- */
        .wallet-container {
            background: #020617; border: 2px solid #fbbf24; border-radius: 12px;
            padding: 10px 15px; margin: 15px auto; width: fit-content;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .coin-unit { display: flex; align-items: center; gap: 4px; font-weight: bold; font-size: 16px; font-family: monospace; }
        .c-oro { color: #fbbf24; } .c-plata { color: #e2e8f0; } .c-bronce { color: #cd7f32; }

        /* --- BOTONES --- */
        .btn-aventura {
            width: 90%; background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: white; border: none; padding: 20px; font-size: 18px; font-weight: bold;
            border-radius: 15px; margin-top: 20px; cursor: pointer;
            box-shadow: 0 4px 0 #7c2d12; text-transform: uppercase; transition: 0.2s;
        }

        /* --- FICHA DE HÉROE Y SLOTS (TODOS RECUPERADOS) --- */
        .hero-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 480px; margin: auto; padding: 15px; background: rgba(15, 23, 42, 0.5); border-radius: 20px; }
        .slot-column { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .slot { 
            width: 54px; height: 54px; background: rgba(30, 41, 59, 0.9); border: 2px solid #475569; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            position: relative; overflow: hidden; cursor: pointer; 
        }
        .slot img { width: 82%; height: 82%; object-fit: contain; z-index: 2; margin-bottom: 6px; }
        .slot::after { 
            content: attr(data-label); position: absolute; bottom: 0; font-size: 7px; 
            color: #94a3b8; text-transform: uppercase; width: 100%; text-align: center; 
            background: rgba(0,0,0,0.8); z-index: 1; padding: 1px 0; pointer-events: none;
        }
        .silhouette { font-size: 120px; opacity: 0.05; display: flex; align-items: center; justify-content: center; }
        .bottom-slots { grid-column: span 3; display: flex; justify-content: center; gap: 12px; margin-top: 15px; }

        /* --- COMBATE Y BOTÍN --- */
        .card { background: #1e293b; border-radius: 20px; overflow: hidden; border: 2px solid #475569; margin-top: 15px; padding-bottom: 20px; }
        .card img { width: 100%; height: auto; max-height: 45vh; object-fit: contain; background: radial-gradient(circle, #334155 0%, #000 100%); }
        .btn-action { background: #ef4444; color: white; border: none; padding: 18px; border-radius: 12px; font-weight: 900; width: 90%; margin: 10px; font-size: 18px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #991b1b; }
        .btn-win { background: #22c55e; box-shadow: 0 4px 0 #166534; }

        /* --- INVENTARIO --- */
        #lista-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; padding: 10px; min-height: 200px; max-width: 550px; margin: auto; }
        .item-slot { width: 65px; height: 65px; background: #1e293b; border: 2px solid #475569; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 4px; cursor: pointer; box-sizing: border-box; transition: background 0.2s; }
        .item-slot:hover { background: #334155; border-color: #94a3b8; }
        .item-slot img { width: 50px; height: 50px; object-fit: contain; }
        .item-name { display: none; }
        .item-slot.empty { border-style: dashed; opacity: 0.5; }

        /* --- RAREZAS --- */
        .poor { border-color: #9d9d9d !important; } .common { border-color: #ffffff !important; }
        .uncommon { border-color: #1eff00 !important; } .rare { border-color: #0070dd !important; }
        .epic { border-color: #a335ee !important; } .legendary { border-color: #ff8000 !important; }

        .quest-log { margin: 20px auto; max-width: 480px; text-align: left; background: #1e293b; border-radius: 15px; padding: 15px; border: 1px solid #3b82f6; }
        .quest-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #334155; }
        .quest-title { color: #fbbf24; font-weight: bold; font-size: 14px; }
        .btn-reset { margin: 40px auto; color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 12px 25px; border-radius: 8px; cursor: pointer; display: block; }

        .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
}
.modal-content {
    background: #1e293b; border: 2px solid #eab308; padding: 25px;
    border-radius: 8px; text-align: center; max-width: 400px; width: 90%;
    box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
}
.modal-content h3 { color: #eab308; margin-top: 0; text-transform: uppercase; }
.modal-content p { color: #f8fafc; font-size: 1.1em; line-height: 1.4; }
.modal-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
.modal-btn {
    padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer;
    font-weight: bold; font-family: inherit; transition: 0.2s;
}
.btn-confirm { background: #16a34a; color: white; }
.btn-cancel { background: #ef4444; color: white; }
.modal-btn:hover { transform: scale(1.05); filter: brightness(1.2); }
    </style>
</head>

async function soltarObjeto(e, indexDestino) {
    e.preventDefault();
    const indexOriginal = e.dataTransfer.getData("indexOriginal");
    
    // 1. Verificación básica
    if (indexOriginal === "" || parseInt(indexOriginal) === indexDestino) return;

    // 2. Intercambiamos las posiciones en el array (convertimos a número para evitar fallos)
    const origen = parseInt(indexOriginal);
    const destino = indexDestino;

    const temp = inventario[origen];
    inventario[origen] = inventario[destino];
    inventario[destino] = temp;

    // 3. Guardamos el nuevo orden
    localStorage.setItem('hq_inv', JSON.stringify(inventario));
    
    // 4. Dibujamos de nuevo inmediatamente
    renderInv();
}

        function AutoOrdenarInventario() {
    // 1. Extraemos solo los objetos que no son null
    let objetosReales = inventario.filter(it => it !== null);

    // Definimos el peso de las rarezas para el orden
    const pesoRareza = { 
        'Legendary': 6, 'Epic': 5, 'Rare': 4, 
        'Uncommon': 3, 'Common': 2, 'Poor': 1 
    };

    // 2. Ordenamos: Primero por Rareza, luego por Tipo, luego por Nombre
    objetosReales.sort((a, b) => {
        if (pesoRareza[b.Rareza] !== pesoRareza[a.Rareza]) {
            return pesoRareza[b.Rareza] - pesoRareza[a.Rareza];
        }
        if (a.Tipo !== b.Tipo) {
            return a.Tipo.localeCompare(b.Tipo);
        }
        return a.n.localeCompare(b.n);
    });

    // 3. Reconstruimos el inventario manteniendo la capacidad máxima
    const capacidadMax = calcularCapacidadMax();
    const nuevoInventario = new Array(capacidadMax).fill(null);

    objetosReales.forEach((it, idx) => {
        nuevoInventario[idx] = it;
    });

    // 4. Guardamos y refrescamos
    inventario = nuevoInventario;
    localStorage.setItem('hq_inv', JSON.stringify(inventario));
    renderInv();
    
    // Feedback visual opcional
    console.log("Inventario ordenado por rareza y tipo.");
}

async function checkQuestProgress(tipo, valor) {
    let actualizo = false;

    // Cambiamos el forEach por un for...of
    for (const q of misionesActivas) {
        if (q.tipo === tipo && !q.completada) {
            if (tipo === "kill") { q.actual++; actualizo = true; }
            if (tipo === "go" && valor.x === q.coord.x && valor.y === q.coord.y) { q.actual = 1; actualizo = true; }
            if (tipo === "item" && jerarquiaRareza[valor] >= jerarquiaRareza[q.itemReq]) { q.actual = 1; actualizo = true; }
            
            if (q.actual >= q.meta) {
                q.completada = true;
                // Ahora este await sí funcionará perfectamente
                await mostrarMensaje(`¡Misión "${q.n}" Lista! Vuelve con el NPC.`, false);
            }
        }
    }

    if (actualizo) {
        localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
    }
}

async function hablarConNPC(idx) {
    const npc = puebloActual.npcs[idx];
    const qAceptada = misionesActivas.find(q => q.owner === npc.n);
    
    if (qAceptada && qAceptada.actual >= qAceptada.meta) {
        // Validación de espacio... (mantenemos la anterior)
        const objetosReales = inventario.filter(slot => slot !== null).length;
        if (objetosReales >= calcularCapacidadMax()) {
        await mostrarMensaje(`${npc.n}: "¡Mochila llena!"`, false); 
        return;
}

        const itemData = itemsDB[qAceptada.recompensa];
        
        // --- LÓGICA DE DESGLOSE DE MONEDAS ---
        let v = qAceptada.bronce || 0;
        let textoMonedas = "";
        if (v >= 10000) textoMonedas = `${Math.floor(v/10000)} monedas de Oro 🟡`;
        else if (v >= 100) textoMonedas = `${Math.floor(v/100)} monedas de Plata ⚪`;
        else textoMonedas = `${v} monedas de Bronce 🟤`;

        // Entregar recompensa
        const primerHueco = inventario.indexOf(null);
        inventario[primerHueco] = { ...itemData, idInstance: Date.now() };
        totalBronce += v;

        await mostrarMensaje(`${npc.n}: "¡Excelente! Toma tu recompensa: ${itemData.n} y ${textoMonedas}."`, false);

        // Guardar y limpiar
        misionesCompletadas.push(qAceptada.id);
        misionesActivas = misionesActivas.filter(q => q.id !== qAceptada.id);

        localStorage.setItem('hq_inv', JSON.stringify(inventario));
        localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
        localStorage.setItem('hq_quests_done', JSON.stringify(misionesCompletadas));
        localStorage.setItem('hq_bronce_total', totalBronce);

        renderPueblo(); renderQuests(); renderInv(); actualizarMonederoUI();
        return;
    }
    // 2. DAR MISIÓN NUEVA (Se mantiene igual, está bien)
    const questDisponible = npc.misionId && !misionesCompletadas.includes(npc.misionId) && !qAceptada;
    if (questDisponible) {
        const mData = dbMisiones.find(m => m.id === npc.misionId);
        if (mData) {
            if (await mostrarMensaje(`${npc.n}: ${mData.desc}\n\n¿Aceptas el encargo?`)) {

                localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
                renderPueblo();
                renderQuests();
            }
        }
        return;
    }

    // 3. DIÁLOGO POR DEFECTO
    await mostrarMensaje(`${npc.n}: "Que las estrellas guíen tu camino."`, false);
}

                <img src="img/${it.f}" style="width:40px; height:40px; border:2px solid ${coloresRareza[it.Rareza]}; border-radius: 4px;">
                <span style="color: ${coloresRareza[it.Rareza]}; font-size: 18px;">${it.n}</span>

            <div style="display:flex; align-items:center; justify-content:center; gap:20px;">
                <span style="font-size: 14px;">${bronceGanado} ${monedaIcono}</span>
            </div>
        </div>`;

    document.getElementById('btn-derrota').style.display = 'none';
    
    // 6. Guardar estado del mapa y datos

    actualizarMonederoUI();
    renderInv(); // Refrescamos el inventario en segundo plano
}   
        
        // --- NAVEGACIÓN Y AUXILIARES ---
        function cambiarVista(d) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-'+d).classList.add('active-view');
            document.getElementById('btn-nav-'+d).classList.add('active');
            if(d === 'mundo') {
                document.getElementById('contenedor-pueblo').style.display = modoAventura ? 'none' : 'block';
                document.getElementById('contenedor-aventura').style.display = (modoAventura && !enCombate) ? 'block' : 'none';
                document.getElementById('pantalla-enemigo').style.display = enCombate ? 'block' : 'none';
                if(!modoAventura) renderPueblo();
            }
            if(d === 'mochila') renderInv();
            if(d === 'heroe') { renderEquipado(); renderQuests(); }
        }

        function irDeAventura() { modoAventura = true; initMapa(); cambiarVista('mundo'); }
        function volverAlPueblo() { modoAventura = false; enCombate = false; cambiarVista('mundo'); }
        function cerrarCombate() { enCombate = false; cambiarVista('mundo'); }

        function initMapa() {
            mundo.sectores = []; mundo.pos = {x:1, y:1};
            for(let x=0;x<3;x++) { 
                mundo.sectores[x]=[]; 
                for(let y=0;y<3;y++) mundo.sectores[x][y]={revelado:(x==1&&y==1), completado:false}; 
            }
            renderMapa();
        }
        
        function renderMapa() {
            const g = document.getElementById('mapa-grid'); g.innerHTML = "";
            for(let y=0;y<3;y++) for(let x=0;x<3;x++) {
                const s = mundo.sectores[x][y]; const d = document.createElement('div');
                const act = (x==mundo.pos.x && y==mundo.pos.y);
                d.className = `sector ${s.revelado?'revelado':''} ${act?'actual':''} ${s.completado?'completado':''}`;
                d.innerHTML = s.revelado ? (act?"🛡️":(s.completado?"🌲":"❓")) : "☁️";
                d.onclick = () => clicarSector(x,y); g.appendChild(d);
            }
        }

        function clicarSector(x, y) {
            const dist = Math.abs(x - mundo.pos.x) + Math.abs(y - mundo.pos.y);
            if (x === mundo.pos.x && y === mundo.pos.y) {
                if (!mundo.sectores[x][y].completado) { enCombate = true; generarEncuentro(); cambiarVista('mundo'); }
                return;
            }
            if (dist === 1) {
                mundo.pos = { x, y }; mundo.sectores[x][y].revelado = true;
                checkQuestProgress("go", {x, y}); renderMapa();
            }
        }

        function generarEncuentro() {
            actual = enemigos[Math.floor(Math.random()*enemigos.length)] || {n:"Goblin", hp:10, f:"error.jpg"};
            document.getElementById('enemigo-nombre').innerText = actual.n;
            document.getElementById('enemigo-hp').innerText = actual.hp;
            document.getElementById('enemigo-img').src = getPath(actual);
            document.getElementById('btn-derrota').style.display = 'inline-block';
            document.getElementById('botin-texto').innerHTML = "";
        }
// --- Inventario -----------------------------------------------------------------

function renderInv() {
    const contenedor = document.getElementById('lista-inv');
    if (!contenedor) return;

    const capacidadMax = calcularCapacidadMax();

    while (inventario.length < capacidadMax) {
        inventario.push(null);
    }
    if (inventario.length > capacidadMax) {
        inventario = inventario.slice(0, capacidadMax);
    }

    const contadorTexto = document.getElementById('inv-capacidad-texto');
    if (contadorTexto) {
        const objetosReales = inventario.filter(slot => slot !== null).length;
        contadorTexto.innerText = `${objetosReales} / ${capacidadMax}`;
        contadorTexto.style.color = objetosReales >= capacidadMax ? "#ef4444" : "#94a3b8";
    }

    contenedor.innerHTML = ""; 

    for (let i = 0; i < capacidadMax; i++) {
        const slot = document.createElement('div');
        slot.className = 'item-slot' + (inventario[i] ? '' : ' empty');
        slot.dataset.index = i;

        // Selección múltiple (CORREGIDO)
        if (seleccionados.includes(i)) {
            slot.classList.add('selected');
        } // <--- CIERRE AQUÍ. Antes estaba al final de la función.

        // Lógica de Soltar (Drop) - Ahora se ejecuta SIEMPRE
        slot.ondragover = (e) => e.preventDefault();
        slot.ondrop = (e) => soltarObjeto(e, i);

        const item = inventario[i];

        if (item) {
            const coincideFiltro = filtroActual === 'Todos' || item.Tipo === filtroActual;
            
            if (coincideFiltro) {
                slot.style.borderColor = coloresRareza[item.Rareza] || '#475569';
                // Si usas subcarpetas, recuerda: `img/${item.subfolder}/${item.f}`
                slot.innerHTML = `<img src="img/${item.f}" title="${item.n}" draggable="true" ondragstart="arrastrarObjeto(event, ${i})" onclick="gestionarItem(${i})">`;
            } else {
                slot.classList.add('empty'); 
            }
        } else {
            slot.classList.add('empty');
        }

        contenedor.appendChild(slot); // Ahora sí se añadirá al contenedor
    }
}

async function gestionarItem(i) {
    const it = inventario[i];
    
    if (modoSeleccion) {
        if (!inventario[i]) return;
        const index = seleccionados.indexOf(i);
        if (index > -1) {
            seleccionados.splice(index, 1);
        } else {
            seleccionados.push(i);
        }
        renderInv();
        return;
    }

    if (!it) return;

    // --- LÓGICA PARA OBJETOS EQUIPABLES ---
    if (it.Tipo === "Equipable") {
        let sId = "";

        // 1. Slots múltiples (bolsas, anillos, abalorios)
        if (it.Slot === "bolsa" || it.Slot === "anillo" || it.Slot === "abalorio") {
            const config = {
                "bolsa": { min: 2, max: 5 },
                "anillo": { min: 1, max: 2 },
                "abalorio": { min: 1, max: 2 }
            };
            const range = config[it.Slot];
            let slotLibre = null;

            for (let n = range.min; n <= range.max; n++) {
                let tempId = `slot-${it.Slot}-${n}`;
                if (!equipado[tempId]) {
                    slotLibre = tempId;
                    break;
                }
            }

            if (slotLibre) {
                sId = slotLibre;
            } else {
                let msg = `Todas las ranuras de ${it.Slot} están llenas. ¿Cuál quieres reemplazar por ${it.n}?\n`;
                for (let n = range.min; n <= range.max; n++) {
                    msg += `${n}. ${equipado[`slot-${it.Slot}-${n}`].n}\n`;
                }
                const el = prompt(msg, range.min.toString());
                if (el === null) return;
                const numSel = parseInt(el);
                if (numSel >= range.min && numSel <= range.max) {
                    sId = `slot-${it.Slot}-${numSel}`;
                } else {
                    await mostrarMensaje(`"Selección no válida."`, false);
                    return;
                }
            }
        } 
        // 2. Armas a dos manos
        else if (it.Slot === "mano1" && it.manos === 2) {
            const m1 = equipado["slot-mano1"];
            const m2 = equipado["slot-mano2"];

            let itemsAQuitar = [];
            if (m1) itemsAQuitar.push(m1.n);
            if (m2) itemsAQuitar.push(m2.n);

            if (itemsAQuitar.length > 0) {
                const mensaje = `${it.n} es a dos manos. ¿Quieres reemplazar ${itemsAQuitar.join(" y ")} por este arma?`;
                const respuesta = await mostrarMensaje(mensaje);
                if (!respuesta) return;
            }

            const huecosLibres = inventario.filter(slot => slot === null).length;
            const itemsADevolver = (m1 ? 1 : 0) + (m2 ? 1 : 0);
            
            if (itemsADevolver > 1 && huecosLibres < 1) { 
                await mostrarMensaje(`"No tienes espacio suficiente para desequipar ambos objetos."`, false);
                return;
            }

            if (m2) {
                const hVacio = inventario.indexOf(null); 
                inventario[hVacio] = { ...m2 };
                equipado["slot-mano2"] = null;
            }
            sId = "slot-mano1";
        } 
        // 3. Slots únicos estándar
        else {
            if (it.Slot === "mano2") {
                const principal = equipado["slot-mano1"];
                if (principal && principal.manos === 2) {
                    await mostrarMensaje(`No puedes equipar esto: ${principal.n} requiere ambas manos.`, false);
                    return;
                }
            }
            sId = "slot-" + it.Slot;
        }

        // 4. Proceso de reemplazo final
        const ex = equipado[sId]; 
        if (ex) {
            if (!(it.Slot === "mano1" && it.manos === 2)) {
                const confirmCambio = await mostrarMensaje(`¿Reemplazar ${ex.n} por ${it.n}?`);
                if (!confirmCambio) return;
            }
            inventario[i] = { ...ex }; 
        } else {
            inventario[i] = null;
        }

        equipado[sId] = { ...it };

        // Actualizar capacidad y guardar
        const nuevaCapacidad = calcularCapacidadMax();
        while (inventario.length < nuevaCapacidad) {
            inventario.push(null);
        }

        localStorage.setItem('hq_inv', JSON.stringify(inventario));
        localStorage.setItem('hq_equipo', JSON.stringify(equipado));
        
        renderInv();
        renderEquipado();
        return; // <--- IMPORTANTE: Salimos de la función aquí si era equipable

    } 
    
    // --- LÓGICA PARA OTROS OBJETOS (Basura, Consumibles, etc.) ---
    // Si llegamos aquí, es que NO era un objeto "Equipable"
    const eliminar = await mostrarMensaje(`¿Seguro que quieres eliminar ${it.n}?`);
    if (eliminar) {
        inventario[i] = null; 
        localStorage.setItem('hq_inv', JSON.stringify(inventario));
        renderInv();
    }
}

async function gestionarEquipado(el) {
    const it = equipado[el.id]; 
    if (el.id === "slot-bolsa-1" || !it) return;

    // 1. Calculamos capacidad resultante
    const capacidadActual = calcularCapacidadMax();
    const espacioQueAportaEstaBolsa = it.Espacios || 0;
    const capacidadSiQuitoBolsa = capacidadActual - espacioQueAportaEstaBolsa;

    // 2. Contamos OBJETOS REALES (no nulls)
    const objetosReales = inventario.filter(slot => slot !== null).length;

    // 3. SEGURIDAD: ¿Caben los objetos + el que voy a desequipar?
    // Sumamos 1 porque la bolsa que desequipas pasará a ocupar un hueco en el inventario
    if ((objetosReales + 1) > capacidadSiQuitoBolsa) {
        await mostrarMensaje(`"¡No puedes desequipar esta bolsa! No hay espacio suficiente para guardar la bolsa y tus objetos."`, false);
        return;
    }

    if (await mostrarMensaje(`¿Desequipar ${it.n}?`)) {
        // --- PROCESO DE REDUCCIÓN DE ARRAY ---
        
        // A. Extraemos solo los objetos que ya tenías
        let objetosParaMudar = inventario.filter(slot => slot !== null);
        
        // B. Añadimos la bolsa que acabamos de quitar a esa lista
        objetosParaMudar.push({ ...it });

        // C. Creamos el nuevo inventario más pequeño
        let nuevoInventario = new Array(capacidadSiQuitoBolsa).fill(null);

        // D. Colocamos todo en el nuevo array
        objetosParaMudar.forEach((obj, idx) => {
            nuevoInventario[idx] = obj;
        });

        // E. Guardamos cambios
        inventario = nuevoInventario;
        delete equipado[el.id];
        
        localStorage.setItem('hq_inv', JSON.stringify(inventario)); 
        localStorage.setItem('hq_equipo', JSON.stringify(equipado));
        
        renderEquipado(); 
        renderInv();
    }
}

        function calcularCapacidadMax() {
    let capacidad = 16; // Mochila base

    // Recorremos los slots de bolsa (del 2 al 5, el 1 es la fija)
    for (let i = 2; i <= 5; i++) {
        const bolsa = equipado[`slot-bolsa-${i}`];
        if (bolsa && bolsa.Espacios) {
            capacidad += bolsa.Espacios;
        }
    }
    return capacidad;
}
        
async function VaciarInventario() {
    if (await mostrarMensaje("¿Estás seguro de que quieres destruir TODOS los objetos de tu mochila?")) {
        const capacidad = calcularCapacidadMax();
        inventario = new Array(capacidad).fill(null);
        localStorage.setItem('hq_inv', JSON.stringify(inventario));
        renderInv();
    }
}

async function cargarDatos() {
    try {
        const v = Date.now();
        const [rEn, rEq, rCo, rBa] = await Promise.all([
            fetch(`enemigos.json?v=${v}`).then(r => r.json()).catch(()=>({})),
            fetch(`equipacion.json?v=${v}`).then(r => r.json()).catch(()=>({})),
            fetch(`consumibles.json?v=${v}`).then(r => r.json()).catch(()=>({})),
            fetch(`basura.json?v=${v}`).then(r => r.json()).catch(()=>({}))
        ]);

        Object.values(rEq).forEach(i => i.subfolder = "equipacion");
        Object.values(rCo).forEach(i => i.subfolder = "consumibles");
        Object.values(rBa).forEach(i => i.subfolder = "basura");

        enemigos = Object.values(rEn); 
        enemigos.forEach(e => e.subfolder = "enemigos");
        itemsDB = {...rEq, ...rCo, ...rBa};

        // --- INICIALIZACIÓN DEL INVENTARIO ---
        let invGuardado = JSON.parse(localStorage.getItem('hq_inv'));
        let capacidad = calcularCapacidadMax();
        if (!invGuardado) {
            inventario = new Array(capacidad).fill(null);
        } else {
            inventario = invGuardado;
            while (inventario.length < capacidad) { inventario.push(null); }
        }

        // --- CARGAR PUEBLO (Movido aquí dentro) ---
        const puebloGuardado = localStorage.getItem('hq_pueblo');
        if (puebloGuardado) {
            puebloActual = JSON.parse(puebloGuardado);
        } else {
            console.log("No hay pueblo inicial.");
            // Opcional: refundarPoblacionSinConfirmar(); 
        }

        misionesActivas = JSON.parse(localStorage.getItem('hq_quests')) || [];
        misionesCompletadas = JSON.parse(localStorage.getItem('hq_quests_done')) || [];
        totalBronce = parseInt(localStorage.getItem('hq_bronce_total')) || 0;

        // --- RENDERIZADO FINAL ---
        renderInv();
        renderPueblo(); 
        renderEquipado();
        renderQuests(); 
        actualizarMonederoUI();
        
    } catch(e) { 
        console.error("Error crítico en la carga:", e); 
    }
}
