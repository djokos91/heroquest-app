<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>HeroQuest Pro - 1.0.16</title>
    <style>
        .filter-btn {
    background: #334155;
    border: 1px solid #475569;
    color: white;
    border-radius: 4px;
    transition: 0.2s;
    }
        .filter-btn:hover {
    background: #3b82f6;
    }
        .item-slot.empty {
    background: rgba(0,0,0,0.1);
    border: 1px dashed #334155;
    }
        /* --- ESTILOS GENERALES (TUS ORIGINALES) --- */
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { 
            display: none; 
            padding: 15px; 
            text-align: center; 
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-view { display: block; }

        nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #1e293b; display: flex; justify-content: space-around; 
            align-items: center; border-top: 2px solid #334155; z-index: 1000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn { 
            background: none; border: none; color: #94a3b8; 
            font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; 
            transition: all 0.2s;
        }
        .nav-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-btn.active { color: #3b82f6; transform: translateY(-2px); }
        .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }
        
        /* --- ANIMACIONES Y HOVER (TUS ORIGINALES REINSTAURADAS) --- */
        .sector:hover, .edificio-card:hover, .item-slot:hover, .slot:hover, .npc-item:hover {
            transform: scale(1.03);
            border-color: #3b82f6 !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            z-index: 5;
            transition: all 0.2s ease;
        }

        /* --- SISTEMA DE MAPA --- */
        #contenedor-aventura { width: 100%; max-width: 500px; margin: auto; display: none; }
        #mapa-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; max-width: 320px; margin: 20px auto; padding: 10px;
        }
        .sector {
            aspect-ratio: 1/1; background: #020617; border: 2px solid #334155;
            border-radius: 15px; display: flex; align-items: center;
            justify-content: center; font-size: 32px; cursor: pointer; position: relative;
        }
        .sector.revelado { background: #064e3b; border-color: #22c55e; }
        .sector.actual { 
            border-color: #3b82f6; border-width: 3px; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); transform: scale(1.08); z-index: 10; 
        }
        .sector.completado { opacity: 0.6; background: #1e293b; border-color: #475569; }

        /* --- PUEBLO Y NPCs --- */
        #contenedor-pueblo { width: 100%; max-width: 600px; margin: auto; position: relative; }
        .town-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .town-type { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 3px; }
        
        /* BOTÓN DE NUEVA POBLACIÓN */
        .btn-refundar {
            position: absolute; top: 0; right: 0;
            background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444;
            padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 10px;
        }

        .edificios-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px; padding: 10px;
        }
        .edificio-card {
            background: #1e293b; border: 1px solid #475569; border-radius: 12px;
            padding: 15px 5px; cursor: pointer;
        }
        .edificio-icon { font-size: 30px; display: block; margin-bottom: 5px; }
        .edificio-name { font-size: 12px; font-weight: bold; color: #e2e8f0; }

        .npc-list { margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; }
        .npc-item { 
            padding: 12px; border-bottom: 1px solid #334155; display: flex; 
            justify-content: space-between; align-items: center; cursor: pointer;
            border-radius: 8px;
        }
        .npc-item:last-child { border-bottom: none; }
        .npc-role { font-size: 10px; color: #94a3b8; text-transform: uppercase; background: #0f172a; padding: 2px 6px; border-radius: 4px; }
        
        .quest-mark { font-weight: bold; font-size: 20px; animation: bounce 1s infinite; }
        .quest-available { color: #fbbf24; }
        .quest-ready { color: #22c55e; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- MONEDERO MULTIDIVISA --- */
        .wallet-container {
            background: #020617; border: 2px solid #fbbf24; border-radius: 12px;
            padding: 10px 15px; margin: 15px auto; width: fit-content;
            display: flex; align-items: center; gap: 15px;

        .c-oro { color: #fbbf24; } .c-plata { color: #e2e8f0; } .c-bronce { color: #cd7f32; }

        /* --- BOTONES --- */
        .btn-aventura {
            width: 90%; background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: white; border: none; padding: 20px; font-size: 18px; font-weight: bold;
            border-radius: 15px; margin-top: 20px; cursor: pointer;
            box-shadow: 0 4px 0 #7c2d12; text-transform: uppercase; transition: 0.2s;
        }

        /* --- FICHA DE HÉROE Y SLOTS (TODOS RECUPERADOS) --- */
        .hero-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 480px; margin: auto; padding: 15px; background: rgba(15, 23, 42, 0.5); border-radius: 20px; }
        .slot-column { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .slot { 
            width: 54px; height: 54px; background: rgba(30, 41, 59, 0.9); border: 2px solid #475569; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            position: relative; overflow: hidden; cursor: pointer; 
        }
        .slot img { width: 82%; height: 82%; object-fit: contain; z-index: 2; margin-bottom: 6px; }
        .slot::after { 
            content: attr(data-label); position: absolute; bottom: 0; font-size: 7px; 
            color: #94a3b8; text-transform: uppercase; width: 100%; text-align: center; 
            background: rgba(0,0,0,0.8); z-index: 1; padding: 1px 0; pointer-events: none;
        }
        .silhouette { font-size: 120px; opacity: 0.05; display: flex; align-items: center; justify-content: center; }
        .bottom-slots { grid-column: span 3; display: flex; justify-content: center; gap: 12px; margin-top: 15px; }

        /* --- COMBATE Y BOTÍN --- */
        .card { background: #1e293b; border-radius: 20px; overflow: hidden; border: 2px solid #475569; margin-top: 15px; padding-bottom: 20px; }
        .card img { width: 100%; height: auto; max-height: 45vh; object-fit: contain; background: radial-gradient(circle, #334155 0%, #000 100%); }
        .btn-action { background: #ef4444; color: white; border: none; padding: 18px; border-radius: 12px; font-weight: 900; width: 90%; margin: 10px; font-size: 18px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #991b1b; }
        .btn-win { background: #22c55e; box-shadow: 0 4px 0 #166534; }

        /* --- INVENTARIO --- */
        #lista-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 15px; padding: 15px; max-width: 550px; margin: auto; }
        .item-slot { width: 85px; height: 110px; background: #1e293b; border: 2px solid #475569; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px; cursor: pointer; box-sizing: border-box; }
        .item-slot img { width: 50px; height: 50px; object-fit: contain; }
        .item-name { font-size: 10px; text-align: center; font-weight: bold; width: 100%; }

        /* --- RAREZAS --- */
        .poor { border-color: #9d9d9d !important; } .common { border-color: #ffffff !important; }
        .uncommon { border-color: #1eff00 !important; } .rare { border-color: #0070dd !important; }
        .epic { border-color: #a335ee !important; } .legendary { border-color: #ff8000 !important; }

        .quest-log { margin: 20px auto; max-width: 480px; text-align: left; background: #1e293b; border-radius: 15px; padding: 15px; border: 1px solid #3b82f6; }
        .quest-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #334155; }
        .quest-title { color: #fbbf24; font-weight: bold; font-size: 14px; }
        .btn-reset { margin: 40px auto; color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 12px 25px; border-radius: 8px; cursor: pointer; display: block; }
    </style>
</head>

    <script>
        // --- TODAS TUS CONSTANTES ORIGINALES ---
        const coloresRareza = { "Poor": "#9d9d9d", "Common": "#ffffff", "Uncommon": "#1eff00", "Rare": "#0070dd", "Epic": "#a335ee", "Legendary": "#ff8000" };
        const jerarquiaRareza = { "Poor": 0, "Common": 1, "Uncommon": 2, "Rare": 3, "Epic": 4, "Legendary": 5 };

        const dbMisiones = [
            { id: "m1", n: "Cacería Primaria", desc: "Derrota a 3 monstruos.", tipo: "kill", meta: 3, recompensa: "arco_caza", bronce: 50 },
            { id: "m2", n: "Explorador", desc: "Alcanza la coordenada (2,2).", tipo: "go", meta: 1, coord: {x:2, y:2}, recompensa: "pocion_vida", bronce: 25 },
            { id: "m3", n: "Coleccionista", desc: "Consigue un item Rare.", tipo: "item", meta: 1, itemReq: "Rare", recompensa: "anillo_fuerza", bronce: 100 }
        ];

        // --- ESTADO (AHORA CON BRONCE TOTAL) ---
        let enemigos = [], itemsDB = {};
        let inventario = safeParse('hq_inv', []);
        let equipado = safeParse('hq_equipo', {});
        let misionesActivas = safeParse('hq_quests', []);
        let misionesCompletadas = safeParse('hq_quests_done', []);
        let puebloActual = safeParse('hq_pueblo', null);
        let totalBronce = safeParse('hq_bronce_total', 0); // Almacenamos todo en bronce
        let modoAventura = false, enCombate = false;
        let mundo = { dimension: 3, sectores: [], pos: { x: 1, y: 1 } };
        let actual = null; 
        let filtroActual = 'Todos';

        function safeParse(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
/ --- Mover objetos en el inventario ---
function arrastrarObjeto(e, indexOriginal) {
    e.dataTransfer.setData("indexOriginal", indexOriginal);
}

function soltarObjeto(e, indexDestino) {
    e.preventDefault();
    const indexOriginal = e.dataTransfer.getData("indexOriginal");
    
    if (indexOriginal === "" || indexOriginal === indexDestino) return;

    // Intercambiamos las posiciones en el array
    const temp = inventario[indexOriginal];
    inventario[indexOriginal] = inventario[indexDestino];
    inventario[indexDestino] = temp;

    // Guardamos el nuevo orden
    localStorage.setItem('hq_inv', JSON.stringify(inventario));
    renderInv();
}

function filtrarInv(tipo) {
    filtroActual = tipo;
    renderInv();
}
        
/ ---  -------------------------------------------------------------
        function getPath(item) {
            if (!item || !item.f) return "img/error.jpg";
            return item.f.includes('/') ? `img/${item.f}` : `img/${item.subfolder}/${item.f}`;
        }

        // --- LÓGICA DEL MONEDERO MULTIDIVISA ---
        function actualizarMonederoUI() {
            // 100 bronce = 1 plata, 100 plata = 1 oro (10,000 bronce = 1 oro)
            const oro = Math.floor(totalBronce / 10000);
            const plata = Math.floor((totalBronce % 10000) / 100);
            const bronce = totalBronce % 100;

            document.getElementById('heroe-oro').innerText = oro;
            document.getElementById('heroe-plata').innerText = plata;
            document.getElementById('heroe-bronce').innerText = bronce;
            
            localStorage.setItem('hq_bronce_total', totalBronce);
        }

        // --- SISTEMA DE POBLACIÓN (GENERADOR) ---
function refundarPoblacion() {
    if(!confirm("¿Deseas generar una nueva población? Se perderá el pueblo actual.")) return;
    
    const nombres = ["Rocanegra", "Valle de Hierro", "Puerto Gélido", "Bastión Solar", "Cala Esmeralda"];
    const tipos = ["Aldea", "Ciudadela", "Campamento", "Pueblo"];
    const nombresNPC = ["Thorin", "Elena", "Kael", "Grom", "Sylvan", "Uther"];
    const trabajos = ["Herrero", "Guía", "Alquimista", "Tabernero", "Explorador"];
    
    // 1. Definimos el objeto puebloActual correctamente (con comas)
    puebloActual = {
        nombre: nombres[Math.floor(Math.random()*nombres.length)],
        tipo: tipos[Math.floor(Math.random()*tipos.length)],
        edificios: [
            {n: "Taberna", icono: "🍺"}, 
            {n: "Forja", icono: "⚒️"},
            {n: "Almacén", icono: "📦"}
        ],
        npcs: [] // Aquí va una COMA, no un punto y coma
    }; // Aquí CERRAMOS el objeto con punto y coma

    // 2. Ahora reiniciamos las variables de misiones (fuera del objeto)
    misionesActivas = [];
    misionesCompletadas = [];

    for(let i=0; i<3; i++){
                puebloActual.npcs.push({
                    n: nombresNPC[Math.floor(Math.random()*nombresNPC.length)] + " " + i,
                    job: trabajos[Math.floor(Math.random()*trabajos.length)],
                    misionId: dbMisiones[i].id
                });
            }

    // 3. Guardamos en el almacenamiento local
    localStorage.setItem('hq_pueblo', JSON.stringify(puebloActual)); // Guardamos el nuevo pueblo
    localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
    localStorage.setItem('hq_quests_done', JSON.stringify(misionesCompletadas));

    // 4. Actualizamos la interfaz
    renderQuests();
    renderPueblo();
    }

        // --- SISTEMA DE MISIONES (TU ORIGINAL) ---
        function checkQuestProgress(tipo, valor) {
            let actualizo = false;
            misionesActivas.forEach(q => {
                if (q.tipo === tipo && !q.completada) {
                    if (tipo === "kill") { q.actual++; actualizo = true; }
                    if (tipo === "go" && valor.x === q.coord.x && valor.y === q.coord.y) { q.actual = 1; actualizo = true; }
                    if (tipo === "item" && jerarquiaRareza[valor] >= jerarquiaRareza[q.itemReq]) { q.actual = 1; actualizo = true; }
                    
                    if (q.actual >= q.meta) {
                        q.completada = true;
                        alert(`¡Misión "${q.n}" Lista! Vuelve con el NPC.`);
                    }
                }
            });
            if (actualizo) localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
        }

function hablarConNPC(idx) {
    const npc = puebloActual.npcs[idx];
    const qAceptada = misionesActivas.find(q => q.owner === npc.n);
    
    // 1. ENTREGA DE MISIÓN (Si ya está terminada)
    if (qAceptada && qAceptada.actual >= qAceptada.meta) {
        // Comprobar espacio
        if (inventario.length >= calcularCapacidadMax()) {
            alert(`${npc.n}: "¡Tu mochila está llena! No puedo darte la recompensa así."`);
            return;
        }

        const itemData = itemsDB[qAceptada.recompensa];
        if (!itemData) {
            alert("Error: Objeto no encontrado en la base de datos.");
            return;
        }

        // Entregar premio
        alert(`${npc.n}: "¡Increíble! Aquí tienes tu ${itemData.n}."`);
        
        inventario.push({ ...itemData, idInstance: Date.now() });
        monedas.bronce += (qAceptada.bronce || 0);

        // Limpiar y guardar
        misionesCompletadas.push(qAceptada.id);
        misionesActivas = misionesActivas.filter(q => q.id !== qAceptada.id);

        localStorage.setItem('hq_inv', JSON.stringify(inventario));
        localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
        localStorage.setItem('hq_quests_done', JSON.stringify(misionesCompletadas));
        localStorage.setItem('hq_monedas', JSON.stringify(monedas));

        renderPueblo();
        renderQuests();
        renderInv();
        return;
    }

    // 2. DAR MISIÓN NUEVA
    const questDisponible = npc.misionId && !misionesCompletadas.includes(npc.misionId) && !qAceptada;
    if (questDisponible) {
        const mData = dbMisiones.find(m => m.id === npc.misionId);
        if (confirm(`${npc.n}: ${mData.desc}\n\n¿Aceptas el encargo?`)) {
            misionesActivas.push({ ...mData, actual: 0, completada: false, owner: npc.n });
            localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
            renderPueblo();
            renderQuests();
        }
        return;
    }

    // 3. DIÁLOGO POR DEFECTO
    alert(`${npc.n}: "Que las estrellas guíen tu camino."`);
}

        // --- RENDERIZADO (TUS ORIGINALES) ---
        function renderPueblo() {
            if (!puebloActual) refundarPoblacion();
            document.getElementById('pueblo-nombre').innerText = puebloActual.nombre;
            document.getElementById('pueblo-tipo').innerText = puebloActual.tipo;
            
            const gE = document.getElementById('lista-edificios');
            gE.innerHTML = puebloActual.edificios.map(ed => `
                <div class="edificio-card" onclick="alert('Entrando en ${ed.n}')">
                    <span class="edificio-icon">${ed.icono}</span>
                    <span class="edificio-name">${ed.n}</span>
                </div>`).join("");

            const gN = document.getElementById('lista-npcs');
            gN.innerHTML = puebloActual.npcs.map((npc, idx) => {
            const questAceptada = misionesActivas.find(q => q.owner === npc.n);
            const questDisponible = npc.misionId && !misionesCompletadas.includes(npc.misionId) && !questAceptada;
            const questLista = questAceptada && questAceptada.completada;

            let iconHTML = '';
            if (questLista) {
              iconHTML = '<span class="quest-mark quest-ready">✅</span>';
            } else if (questAceptada) {
            // ESTE ES EL NUEVO ICONO: Muestra que el NPC está esperando
              iconHTML = '<span class="quest-mark" style="color: #f59e0b; opacity:0.7;">❓</span>'; 
            } else if (questDisponible) {
              iconHTML = '<span class="quest-mark quest-available">❗</span>';
            }
                return `<div class="npc-item" onclick="hablarConNPC(${idx})">
                    <div><b>${npc.n}</b><br><span class="npc-role">${npc.job}</span></div>
                    ${iconHTML}
                </div>`;
            }).join("");
        }

        function renderEquipado() {
            document.querySelectorAll('.slot').forEach(s => { 
                if(s.id !== 'slot-bolsa-1') s.innerHTML = ""; 
                s.style.borderColor = "#475569"; 
            });
            const b1 = document.getElementById('slot-bolsa-1');
            if(b1) b1.innerHTML = `<img src="img/equipacion/mochila.jpg">`;
            for (const slotId in equipado) {
                const it = equipado[slotId];
                const target = document.getElementById(slotId);
                if (target && it) {
                    target.innerHTML = `<img src="${getPath(it)}">`;
                    target.style.borderColor = coloresRareza[it.Rareza] || "#475569";
                }
            }
            actualizarMonederoUI();
        }

        function abandonarMision(questId) {
    if (confirm("¿Seguro que quieres abandonar esta misión? Perderás todo el progreso acumulado en ella.")) {
        misionesActivas = misionesActivas.filter(q => q.id !== questId);
        localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
        renderQuests(); // Actualiza la lista del diario
        renderPueblo(); // Actualiza los iconos de los NPCs en el pueblo
    }
}

function renderQuests() {
    const c = document.getElementById('quest-log-container');
    if (!c) return;

    // Diccionario de colores (asegúrate de que coincidan con tus strings de Rareza)
    const coloresRareza = {
        "Common": "#f1f5f9",    // Blanco/Gris
        "Uncommon": "#4ade80",  // Verde
        "Rare": "#3b82f6",      // Azul
        "Epic": "#a855f7",      // Morado
        "Legendary": "#fbbf24"  // Dorado
    };

    c.innerHTML = misionesActivas.length ? misionesActivas.map(q => {
        const itemData = itemsDB[q.recompensa];
        const nombreItem = itemData ? itemData.n : q.recompensa;
        
        // Obtenemos el color según la rareza del objeto
        const colorRareza = (itemData && coloresRareza[itemData.Rareza]) ? coloresRareza[itemData.Rareza] : "#fbbf24";

        let monedaIcono = "🟤";
        let cantidadMostrada = q.bronce;
        if (q.bronce >= 10000) { monedaIcono = "🟡"; cantidadMostrada = Math.floor(q.bronce / 10000); }
        else if (q.bronce >= 100) { monedaIcono = "⚪"; cantidadMostrada = Math.floor(q.bronce / 100); }

        return `
        <div class="quest-entry" style="border-left: 3px solid #3b82f6; padding: 10px; margin-bottom: 15px; background: rgba(30, 41, 59, 0.5); border-radius: 0 8px 8px 0;">
            <div class="quest-title" style="font-weight: bold; color: white;">${q.n} ${q.completada ? '✅' : ''}</div>
            <div style="font-size:10px; color:#3b82f6; margin-bottom: 4px;">👤 ${q.owner}</div>
            <div style="font-size:11px; color:#94a3b8; font-style: italic; margin-bottom: 8px;">"${q.desc}"</div>            
            <div style="display: flex; gap: 15px; margin-bottom: 8px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 4px;">              
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span>🎁</span>
                    <span style="font-size: 11px; color: ${colorRareza}; font-weight: bold;">${nombreItem}</span>
                </div>
                  <div style="display: flex; align-items: center; gap: 4px;">
                    <span style="font-size: 11px; color: #e2e8f0;">${cantidadMostrada}</span>
                    <span>${monedaIcono}</span>                    
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 12px; font-weight: bold; color: ${q.completada ? '#22c55e' : '#e2e8f0'}">
                    Progreso: ${q.actual}/${q.meta}
                </div>
                <button onclick="abandonarMision('${q.id}')" 
                        style="background: none; border: 1px solid #ef4444; color: #ef4444; font-size: 9px; padding: 2px 6px; border-radius: 4px; cursor: pointer;">
                    🗑️ ABANDONAR
                </button>
            </div>
        </div>`;
    }).join("") : '<p style="font-size:12px; color:#64748b; text-align:center;">No tienes misiones en curso.</p>';
}
             
        // --- LÓGICA DE AVENTURA (TU ORIGINAL) ---
        function derrotarEnemigo() {
    if (inventario.length >= calcularCapacidadMax()) { alert("¡Mochila llena!"); return; }
    const it = { ...Object.values(itemsDB)[Math.floor(Math.random()*Object.values(itemsDB).length)] };
    const bronceGanado = Math.floor(Math.random() * 15) + 5;
    
    // Determinar icono de moneda según la cantidad
    let monedaIcono = "🟤";
    if (bronceGanado >= 100) monedaIcono = "🟡";
    else if (bronceGanado >= 50) monedaIcono = "⚪";

    inventario.push(it);
    totalBronce += bronceGanado;
    
    checkQuestProgress("kill", 1); 
    checkQuestProgress("item", it.Rareza);

    // Render visual del botín con iconos
    document.getElementById('botin-texto').innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
            <div style="color: #fbbf24; font-weight: bold; font-size: 20px; letter-spacing: 2px; text-transform: uppercase;">✨ BOTÍN ✨</div>
            <div style="display:flex; align-items:center; gap:8px;">
                    <img src="${getPath(it)}" style="width:40px; height:40px; border:2px solid ${coloresRareza[it.Rareza]}; border-radius: 4px;">
                    <span style="color: ${coloresRareza[it.Rareza]}; font-size: 18px;">${it.n}</span></div>
                <div style="display:flex; align-items:center; justify-content:center; gap:20px;">
                <span style="font-size: 14px;">${bronceGanado} ${monedaIcono}</span></div>
        </div>`;

    document.getElementById('btn-derrota').style.display = 'none';
    mundo.sectores[mundo.pos.x][mundo.pos.y].completado = true;
    localStorage.setItem('hq_inv', JSON.stringify(inventario));
    actualizarMonederoUI();
    }     
        
        // --- NAVEGACIÓN Y AUXILIARES ---
        function cambiarVista(d) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-'+d).classList.add('active-view');
            document.getElementById('btn-nav-'+d).classList.add('active');
            if(d === 'mundo') {
                document.getElementById('contenedor-pueblo').style.display = modoAventura ? 'none' : 'block';
                document.getElementById('contenedor-aventura').style.display = (modoAventura && !enCombate) ? 'block' : 'none';
                document.getElementById('pantalla-enemigo').style.display = enCombate ? 'block' : 'none';
                if(!modoAventura) renderPueblo();
            }
            if(d === 'mochila') renderInv();
            if(d === 'heroe') { renderEquipado(); renderQuests(); }
        }

        function irDeAventura() { modoAventura = true; initMapa(); cambiarVista('mundo'); }
        function volverAlPueblo() { modoAventura = false; enCombate = false; cambiarVista('mundo'); }
        function cerrarCombate() { enCombate = false; cambiarVista('mundo'); }

        function initMapa() {
            mundo.sectores = []; mundo.pos = {x:1, y:1};
            for(let x=0;x<3;x++) { 
                mundo.sectores[x]=[]; 
                for(let y=0;y<3;y++) mundo.sectores[x][y]={revelado:(x==1&&y==1), completado:false}; 
            }
            renderMapa();
        }
        
        function renderMapa() {
            const g = document.getElementById('mapa-grid'); g.innerHTML = "";
            for(let y=0;y<3;y++) for(let x=0;x<3;x++) {
                const s = mundo.sectores[x][y]; const d = document.createElement('div');
                const act = (x==mundo.pos.x && y==mundo.pos.y);
                d.className = `sector ${s.revelado?'revelado':''} ${act?'actual':''} ${s.completado?'completado':''}`;
                d.innerHTML = s.revelado ? (act?"🛡️":(s.completado?"🌲":"❓")) : "☁️";
                d.onclick = () => clicarSector(x,y); g.appendChild(d);
            }
        }

        function clicarSector(x, y) {
            const dist = Math.abs(x - mundo.pos.x) + Math.abs(y - mundo.pos.y);
            if (x === mundo.pos.x && y === mundo.pos.y) {
                if (!mundo.sectores[x][y].completado) { enCombate = true; generarEncuentro(); cambiarVista('mundo'); }
                return;
            }
            if (dist === 1) {
                mundo.pos = { x, y }; mundo.sectores[x][y].revelado = true;
                checkQuestProgress("go", {x, y}); renderMapa();
            }
        }

        function generarEncuentro() {
            actual = enemigos[Math.floor(Math.random()*enemigos.length)] || {n:"Goblin", hp:10, f:"error.jpg"};
            document.getElementById('enemigo-nombre').innerText = actual.n;
            document.getElementById('enemigo-hp').innerText = actual.hp;
            document.getElementById('enemigo-img').src = getPath(actual);
            document.getElementById('btn-derrota').style.display = 'inline-block';
            document.getElementById('botin-texto').innerHTML = "";
        }
// --- Inventario -----------------------------------------------------------------

function renderInv() {
    const contenedor = document.getElementById('inventario-grid');
    if (!contenedor) return;

    const capacidadMax = calcularCapacidadMax();
    const contadorTexto = document.getElementById('inv-capacidad-texto');
    if (contadorTexto) {
        contadorTexto.innerText = `${inventario.length} / ${capacidadMax}`;
        contadorTexto.style.color = inventario.length >= capacidadMax ? "#ef4444" : "#94a3b8";
    }

    contenedor.innerHTML = ""; // Limpiamos

    // Creamos exactamente tantos slots como capacidad máxima
    for (let i = 0; i < capacidadMax; i++) {
        const slot = document.createElement('div');
        slot.className = 'item-slot';
        slot.dataset.index = i; // Guardamos la posición del slot

        // Lógica de Soltar (Drop)
        slot.ondragover = (e) => e.preventDefault();
        slot.ondrop = (e) => soltarObjeto(e, i);

        const item = inventario[i]; // Buscamos si hay un objeto en esta posición

        if (item) {
            // Aplicar filtro visual (si no coincide con el filtro, lo ocultamos o bajamos opacidad)
            const coincideFiltro = filtroActual === 'Todos' || item.Tipo === filtroActual;
            
            if (coincideFiltro) {
                slot.style.borderColor = coloresRareza[item.Rareza] || '#475569';
                slot.innerHTML = `<img src="img/${item.f}" title="${item.n}" draggable="true" ondragstart="arrastrarObjeto(event, ${i})" onclick="gestionarItem(${i})">`;
            } else {
                slot.style.opacity = "0.2"; // Los que no coinciden se ven apagados
            }
        } else {
            slot.classList.add('empty');
        }

        contenedor.appendChild(slot);
    }
}

function gestionarItem(i) {
    const it = inventario[i];
    if (!it) return;

    if (it.Tipo === "Equipable") {
        let sId = "";

        // --- LÓGICA DE SLOTS MÚLTIPLES (Bolsas, Anillos, Abalorios) ---
        if (it.Slot === "bolsa" || it.Slot === "anillo" || it.Slot === "abalorio") {
            const config = {
                "bolsa": { min: 2, max: 5 },
                "anillo": { min: 1, max: 2 },
                "abalorio": { min: 1, max: 2 }
            };

            const range = config[it.Slot];
            let slotLibre = null;

            // 1. Buscamos el primer hueco vacío
            for (let n = range.min; n <= range.max; n++) {
                let tempId = `slot-${it.Slot}-${n}`;
                if (!equipado[tempId]) {
                    slotLibre = tempId;
                    break;
                }
            }

            if (slotLibre) {
                sId = slotLibre; // Encontrado hueco, se asigna directamente
            } else {
                // 2. Si todo está lleno, preguntamos por cuál reemplazar
                let msg = `Todas las ranuras de ${it.Slot} están llenas. ¿Cuál quieres reemplazar por ${it.n}?\n`;
                for (let n = range.min; n <= range.max; n++) {
                    msg += `${n}. ${equipado[`slot-${it.Slot}-${n}`].n}\n`;
                }
                
                const el = prompt(msg, range.min.toString());
                if (el === null) return;
                
                const numSel = parseInt(el);
                if (numSel >= range.min && numSel <= range.max) {
                    sId = `slot-${it.Slot}-${numSel}`;
                } else {
                    alert("Selección no válida.");
                    return;
                }
            }
        } else {
            // --- LÓGICA DE SLOTS ÚNICOS (Casco, Pechera, Arma, etc.) ---
            sId = "slot-" + it.Slot;
        }

        // --- PROCESO DE EQUIPO / REEMPLAZO FINAL ---
        const ex = equipado[sId]; 

        if (ex) {
            // Si el slot está ocupado (sea automático o elegido), confirmamos cambio
            if (!confirm(`¿Quieres reemplazar ${ex.n} por ${it.n}?`)) return;
            inventario[i] = { ...ex }; 
        } else {
            // Si estaba vacío, equipo directo
            inventario[i] = null
        }

        equipado[sId] = { ...it };

        // Guardar y refrescar
        localStorage.setItem('hq_inv', JSON.stringify(inventario));
        localStorage.setItem('hq_equipo', JSON.stringify(equipado));
        
        renderInv();
        renderEquipado();

    } else if (confirm(`¿Eliminar ${it.n}?`)) {
        inventario.splice(i, 1);
        localStorage.setItem('hq_inv', JSON.stringify(inventario));
        renderInv();
    }
}

function gestionarEquipado(el) {
    const it = equipado[el.id]; 
    if (el.id === "slot-bolsa-1" || !it) return;

    // LÓGICA DE SEGURIDAD:
    // Calculamos qué pasaría si quitamos la bolsa
    const capacidadActual = calcularCapacidadMax();
    const espacioQueOcupaBolsa = it.Espacios || 0;
    const capacidadSiQuitoBolsa = capacidadActual - espacioQueOcupaBolsa;

    if (inventario.length >= capacidadSiQuitoBolsa) {
        alert("¡No puedes desequipar esta bolsa! El inventario resultante sería demasiado pequeño para tus objetos actuales.");
        return;
    }

    if (confirm(`¿Desequipar ${it.n}?`)) {
        inventario.push({ ...it }); 
        delete equipado[el.id];
        localStorage.setItem('hq_inv', JSON.stringify(inventario)); 
        localStorage.setItem('hq_equipo', JSON.stringify(equipado));
        renderEquipado(); 
        renderInv();
    }
}

        function calcularCapacidadMax() {
    let capacidad = 16; // Mochila base

    // Recorremos los slots de bolsa (del 2 al 5, el 1 es la fija)
    for (let i = 2; i <= 5; i++) {
        const bolsa = equipado[`slot-bolsa-${i}`];
        if (bolsa && bolsa.Espacios) {
            capacidad += bolsa.Espacios;
        }
    }
    return capacidad;
}
        
        function VaciarInventario() {
    if(confirm("¿Deseas vaciar el inventario?")) {        
        inventario = []; // 1. Vaciamos solo el array de la mochila             
        localStorage.setItem('hq_inv', JSON.stringify(inventario)); // 2. Guardamos solo el cambio del inventario               
        renderInv(); // 3. Actualizamos solo la vista de la mochila
    }
}
// --- Cargar Datos ---------------------------------------     
async function cargarDatos() {
    try {
        const v = Date.now();
        const [rEn, rEq, rCo, rBa] = await Promise.all([
            fetch(`enemigos.json?v=${v}`).then(r => r.json()).catch(()=>({})),
            fetch(`equipacion.json?v=${v}`).then(r => r.json()).catch(()=>({})),
            fetch(`consumibles.json?v=${v}`).then(r => r.json()).catch(()=>({})),
            fetch(`basura.json?v=${v}`).then(r => r.json()).catch(()=>({}))
        ]);

        Object.values(rEq).forEach(i => i.subfolder = "equipacion");
        Object.values(rCo).forEach(i => i.subfolder = "consumibles");
        Object.values(rBa).forEach(i => i.subfolder = "basura");

        enemigos = Object.values(rEn); 
        enemigos.forEach(e => e.subfolder = "enemigos");

        itemsDB = {...rEq, ...rCo, ...rBa};

        // --- INICIALIZACIÓN CRÍTICA DEL INVENTARIO ---
        let invGuardado = JSON.parse(localStorage.getItem('hq_inv'));
        let capacidad = calcularCapacidadMax();

        if (!invGuardado) {
            // Si es la primera vez, creamos array vacío con la capacidad actual
            inventario = new Array(capacidad).fill(null);
        } else {
            inventario = invGuardado;
            // Si compramos bolsas nuevas, extendemos el array para no perder huecos
            while (inventario.length < capacidad) {
                inventario.push(null);
            }
        }

        renderPueblo(); 
        renderEquipado();
        renderQuests(); 
        mostrarVersion();
        
    } catch(e) { 
        console.error("Error en la carga de archivos JSON:", e); 
    }
}
        cargarDatos();
    </script>
