<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>HeroQuest Pro Edition - Full Build</title>
    <style>
        /* --- ESTILOS GENERALES Y RESET --- */
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- CONTENEDORES DE VISTA --- */
        .tab-content { 
            display: none; 
            padding: 15px; 
            text-align: center; 
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-view { display: block; }

        /* --- NAVEGACIÓN PRINCIPAL --- */
        nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            height: 70px; 
            background: #1e293b; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 2px solid #334155; 
            z-index: 1000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn { 
            background: none; 
            border: none; 
            color: #94a3b8; 
            font-size: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s;
            flex: 1;
        }
        .nav-btn.active { color: #3b82f6; transform: translateY(-2px); }
        .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }
        
        /* --- SISTEMA DE MAPA --- */
        #contenedor-mapa { width: 100%; max-width: 500px; margin: auto; }
        #mapa-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 20px auto;
            padding: 10px;
        }
        .sector {
            aspect-ratio: 1/1;
            background: #020617;
            border: 2px solid #334155;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .sector.revelado { background: #064e3b; border-color: #22c55e; }
        .sector.actual { 
            border-color: #3b82f6; 
            border-width: 3px; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); 
            transform: scale(1.08); 
            z-index: 10; 
        }
        .sector.completado { opacity: 0.6; background: #1e293b; border-color: #475569; }
        .sector.niebla { color: #1e293b; background: #0f172a; }

        /* --- INTERFAZ DE COMBATE --- */
        .card { 
            background: #1e293b; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 2px solid #475569; 
            margin-top: 15px; 
            padding-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .card img { 
            width: 100%; 
            height: auto; 
            max-height: 45vh; 
            object-fit: contain; 
            display: block; 
            background: radial-gradient(circle, #334155 0%, #000 100%); 
        }
        .enemy-info { padding: 15px; }
        .btn-action { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 12px; 
            font-weight: 900; 
            width: 90%; 
            margin: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #991b1b;
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .btn-win { background: #22c55e; box-shadow: 0 4px 0 #166534; }
        .btn-back { background: #475569; box-shadow: 0 4px 0 #1e293b; margin-bottom: 15px; }

        /* --- FICHA DE HÉROE (DENSE GRID) --- */
        .hero-container { 
            display: grid; 
            grid-template-columns: 1fr 2fr 1fr; 
            gap: 10px; 
            max-width: 480px; 
            margin: auto; 
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 20px;
        }
        .slot-column { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .slot { 
            width: 52px; 
            height: 52px; 
            background: rgba(30, 41, 59, 0.9); 
            border: 2px solid #475569; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .slot:hover { border-color: #3b82f6; background: #334155; }
        .slot img { width: 85%; height: 85%; object-fit: contain; z-index: 2; }
        .slot::after { 
            content: attr(data-label); 
            position: absolute; 
            bottom: 0; 
            font-size: 7px; 
            color: #94a3b8; 
            text-transform: uppercase; 
            width: 100%; 
            text-align: center; 
            background: rgba(0,0,0,0.6);
            z-index: 1;
        }
        .silhouette { font-size: 120px; opacity: 0.05; display: flex; align-items: center; justify-content: center; }
        .bottom-slots { grid-column: span 3; display: flex; justify-content: center; gap: 12px; margin-top: 15px; }

        /* --- SISTEMA DE MOCHILA E INVENTARIO --- */
        #lista-inv { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); 
            gap: 15px; 
            padding: 15px; 
            max-width: 550px; 
            margin: auto; 
        }
        .item-slot { 
            width: 85px; 
            height: 110px; 
            background: #1e293b; 
            border: 2px solid #475569; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 8px; 
            cursor: pointer; 
            transition: transform 0.2s, border-color 0.2s;
            box-sizing: border-box; 
        }
        .item-slot:active { transform: scale(0.95); }
        .item-slot img { width: 50px; height: 50px; object-fit: contain; }
        .item-name { 
            font-size: 10px; 
            text-align: center; 
            line-height: 11px; 
            word-wrap: break-word; 
            width: 100%; 
            font-weight: bold;
            margin-top: 5px;
        }
        
        /* --- COLORES DE RAREZA --- */
        .poor { border-color: #9d9d9d !important; }
        .common { border-color: #ffffff !important; }
        .uncommon { border-color: #1eff00 !important; }
        .rare { border-color: #0070dd !important; }
        .epic { border-color: #a335ee !important; }
        .legendary { border-color: #ff8000 !important; }

        .btn-reset { 
            margin: 40px auto; 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1); 
            border: 1px solid #ef4444; 
            padding: 12px 25px; 
            border-radius: 8px; 
            font-size: 13px; 
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>

    <section id="vista-mundo" class="tab-content active-view">
        <h2 style="color: #22c55e; font-style: italic; letter-spacing: 2px;">BOSQUE DE AVENTURAS</h2>
        <div id="contenedor-mapa">
            <div id="mapa-grid"></div>
            <p id="mapa-info" style="font-size: 13px; color: #94a3b8; padding: 0 20px;">
                Explora el terreno. Debes estar en una zona para entrar en combate.
            </p>
        </div>

        <div id="pantalla-enemigo" style="display: none;">
            <button class="btn-action btn-back" onclick="cerrarZoom()">⬅ RETROCEDER AL MAPA</button>
            <div class="card">
                <img id="enemigo-img" src="" alt="Enemigo">
                <div class="enemy-info">
                    <h3 id="enemigo-nombre" style="margin: 5px 0; font-size: 24px; color: #f87171;"></h3>
                    <p style="color: #94a3b8; font-size: 18px;">Puntos de Vida: <span id="enemigo-hp" style="color: #ef4444; font-weight: bold;"></span></p>
                </div>
                <button id="btn-derrota" class="btn-action btn-win" onclick="derrotarEnemigo()">⚔️ ENEMIGO DERROTADO</button>
                <div id="botin-texto" style="padding: 20px; color: #fbbf24; font-weight: bold; min-height: 100px; font-size: 18px;"></div>
            </div>
        </div>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6; letter-spacing: 2px;">FICHA DE PERSONAJE</h2>
        <div class="hero-container">
            <div class="slot-column">
                <div id="slot-cabeza" class="slot" data-label="Cabeza" onclick="gestionarEquipado(this)"></div>
                <div id="slot-cuello" class="slot" data-label="Cuello" onclick="gestionarEquipado(this)"></div>
                <div id="slot-hombros" class="slot" data-label="Hombros" onclick="gestionarEquipado(this)"></div>
                <div id="slot-espalda" class="slot" data-label="Espalda" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pecho" class="slot" data-label="Pecho" onclick="gestionarEquipado(this)"></div>
                <div id="slot-brazos" class="slot" data-label="Brazos" onclick="gestionarEquipado(this)"></div>
                <div id="slot-manos" class="slot" data-label="Manos" onclick="gestionarEquipado(this)"></div>
            </div>
            
            <div class="silhouette">👤</div>
            
            <div class="slot-column">
                <div id="slot-cintura" class="slot" data-label="Cintura" onclick="gestionarEquipado(this)"></div>
                <div id="slot-piernas" class="slot" data-label="Piernas" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pies" class="slot" data-label="Pies" onclick="gestionarEquipado(this)"></div>
                <div id="slot-anillo-1" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-anillo-2" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-abalorio-1" class="slot" data-label="Abalorio" onclick="gestionarEquipado(this)"></div>
                <div id="slot-abalorio-2" class="slot" data-label="Abalorio" onclick="gestionarEquipado(this)"></div>
            </div>
            
            <div class="bottom-slots">
                <div id="slot-mano1" class="slot" data-label="Mano 1" onclick="gestionarEquipado(this)"></div>
                <div id="slot-mano2" class="slot" data-label="Mano 2" onclick="gestionarEquipado(this)"></div>
                <div id="slot-distancia" class="slot" data-label="Rango" onclick="gestionarEquipado(this)"></div>
                <div id="slot-municion" class="slot" data-label="Munición" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>
        
        <div style="margin-top: 25px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px;">
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px; font-weight: bold;">GESTIÓN DE CONTENEDORES</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <div id="slot-bolsa-1" class="slot" data-label="Base" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-2" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-3" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-4" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-5" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308; letter-spacing: 2px;">INVENTARIO</h2>
        <div id="lista-inv"></div>
        <button class="btn-reset" onclick="borrarTodo()">⚠️ ELIMINAR TODOS LOS OBJETOS</button>
    </section>

    <nav>
        <button class="nav-btn active" id="btn-nav-mundo" onclick="cambiarVista('mundo')">
            <span>🌍</span>MAPA
        </button>
        <button class="nav-btn" id="btn-nav-heroe" onclick="cambiarVista('heroe')">
            <span>🛡️</span>HÉROE
        </button>
        <button class="nav-btn" id="btn-nav-mochila" onclick="cambiarVista('mochila')">
            <span>🎒</span>MOCHILA
        </button>
    </nav>

    <script>
        /**
         * CONFIGURACIÓN GLOBAL Y CONSTANTES
         */
        const coloresRareza = { 
            "Poor": "#9d9d9d", "Common": "#ffffff", "Uncommon": "#1eff00", 
            "Rare": "#0070dd", "Epic": "#a335ee", "Legendary": "#ff8000" 
        };
        const jerarquiaRareza = { "Poor": 0, "Common": 1, "Uncommon": 2, "Rare": 3, "Epic": 4, "Legendary": 5 };

        /**
         * PERSISTENCIA DE DATOS SEGURA
         */
        function safeParse(key, defaultVal) {
            const data = localStorage.getItem(key);
            if (!data || data === "undefined" || data === "null") return defaultVal;
            try { return JSON.parse(data); } catch(e) { return defaultVal; }
        }

        /**
         * VARIABLES DE ESTADO
         */
        let enemigos = [];
        let itemsDB = {};
        let inventario = safeParse('hq_inv', []);
        let equipado = safeParse('hq_equipo', {});
        let actual = null;
        let mundo = { 
            dimension: 3, 
            sectores: [], 
            pos: { x: 1, y: 1 } 
        };

        /**
         * UTILIDADES DE IMAGEN
         */
        function getPath(item) {
            if (!item || !item.f) return "img/error.jpg";
            if (item.f.includes('/')) return `img/${item.f}`;
            return `img/${item.subfolder}/${item.f}`;
        }

        /**
         * CARGA DE ARCHIVOS JSON EXTERNOS
         */
        async function cargarDatos() {
            console.log("Iniciando carga de bases de datos...");
            try {
                const v = Date.now();
                const [resEn, resEq, resCo, resBa] = await Promise.all([
                    fetch(`enemigos.json?v=${v}`).then(r => r.json()),
                    fetch(`equipacion.json?v=${v}`).then(r => r.json()),
                    fetch(`consumibles.json?v=${v}`).then(r => r.json()),
                    fetch(`basura.json?v=${v}`).then(r => r.json())
                ]);

                // Asignar carpetas para las rutas de imagen automáticas
                Object.values(resEq).forEach(it => it.subfolder = "equipacion");
                Object.values(resCo).forEach(it => it.subfolder = "consumibles");
                Object.values(resBa).forEach(it => it.subfolder = "basura");
                
                enemigos = Object.values(resEn);
                enemigos.forEach(en => en.subfolder = "enemigos");
                itemsDB = { ...resEq, ...resCo, ...resBa };
                
                console.log("Datos cargados correctamente.");
                initMapa();
                renderEquipado();
            } catch (err) { 
                console.error("Error crítico cargando JSON:", err); 
            }
        }

        /**
         * LÓGICA DEL MAPA Y EXPLORACIÓN
         */
        function initMapa() {
            mundo.sectores = [];
            for (let x = 0; x < mundo.dimension; x++) {
                mundo.sectores[x] = [];
                for (let y = 0; y < mundo.dimension; y++) {
                    mundo.sectores[x][y] = { 
                        revelado: (x === mundo.pos.x && y === mundo.pos.y),
                        completado: false 
                    };
                }
            }
            renderMapa();
        }

        function renderMapa() {
            const grid = document.getElementById('mapa-grid');
            if (!grid) return;
            grid.innerHTML = "";
            for (let y = 0; y < mundo.dimension; y++) {
                for (let x = 0; x < mundo.dimension; x++) {
                    const s = mundo.sectores[x][y];
                    const div = document.createElement('div');
                    const esActual = (x === mundo.pos.x && y === mundo.pos.y);
                    
                    div.className = `sector ${s.revelado ? 'revelado' : 'niebla'} ${esActual ? 'actual' : ''} ${s.completado ? 'completado' : ''}`;
                    
                    if (s.revelado) {
                        div.innerHTML = esActual ? "🛡️" : (s.completado ? "🌲" : "❓");
                    } else {
                        div.innerHTML = "☁️";
                    }
                    
                    div.onclick = () => clicarSector(x, y);
                    grid.appendChild(div);
                }
            }
        }

        function clicarSector(x, y) {
            const dist = Math.abs(x - mundo.pos.x) + Math.abs(y - mundo.pos.y);
            if (x === mundo.pos.x && y === mundo.pos.y) {
                if (!mundo.sectores[x][y].completado) entrarEnSector();
                else alert("Esta zona ya ha sido limpiada de enemigos.");
                return;
            }
            if (dist === 1) {
                mundo.pos = { x, y };
                mundo.sectores[x][y].revelado = true;
                renderMapa();
            } else {
                alert("Demasiado lejos. Solo puedes moverte a zonas adyacentes.");
            }
        }

        function entrarEnSector() {
            document.getElementById('contenedor-mapa').style.display = 'none';
            document.getElementById('pantalla-enemigo').style.display = 'block';
            generarEncuentro(); 
        }

        function cerrarZoom() {
            document.getElementById('contenedor-mapa').style.display = 'block';
            document.getElementById('pantalla-enemigo').style.display = 'none';
            renderMapa();
        }

        /**
         * LÓGICA DE COMBATE Y BOTÍN
         */
        function generarEncuentro() {
            actual = enemigos[Math.floor(Math.random() * enemigos.length)];
            document.getElementById('enemigo-nombre').innerText = actual.n;
            document.getElementById('enemigo-hp').innerText = actual.hp;
            document.getElementById('enemigo-img').src = getPath(actual);
            document.getElementById('btn-derrota').style.display = 'inline-block';
            document.getElementById('botin-texto').innerHTML = "";
        }

        function derrotarEnemigo() {
            const max = calcularCapacidadMax();
            if (inventario.length >= max) { 
                alert("¡Tu mochila está llena! Tira algo para poder recoger el botín."); 
                return; 
            }
            
            const nivelMax = jerarquiaRareza[actual.LootTable] || 0;
            const posibles = Object.values(itemsDB).filter(it => (jerarquiaRareza[it.Rareza] || 0) <= nivelMax);
            
            if (posibles.length > 0) {
                const itemObtenido = { ...posibles[Math.floor(Math.random() * posibles.length)] };
                inventario.push(itemObtenido);
                localStorage.setItem('hq_inv', JSON.stringify(inventario));
                
                const color = coloresRareza[itemObtenido.Rareza] || "#fff";
                document.getElementById('botin-texto').innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
                        <span style="color:white; font-size:14px">HAS ENCONTRADO:</span>
                        <img src="${getPath(itemObtenido)}" style="width:60px; border:3px solid ${color}; border-radius:8px; background:#000">
                        <span style="color:${color}; font-size:22px">${itemObtenido.n}</span>
                        <span style="color:#94a3b8; font-size:12px; font-weight:normal">[${itemObtenido.Rareza}]</span>
                    </div>`;
                document.getElementById('btn-derrota').style.display = 'none';
                mundo.sectores[mundo.pos.x][mundo.pos.y].completado = true;
            }
        }

        /**
         * GESTIÓN DE VISTAS (TABS)
         */
        function cambiarVista(donde) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-' + donde).classList.add('active-view');
            document.getElementById('btn-nav-' + donde).classList.add('active');
            
            if(donde === 'mochila') renderInv();
            if(donde === 'heroe') renderEquipado();
        }

        /**
         * CÁLCULO DE CAPACIDAD (BOLSAS)
         */
        function calcularCapacidadMax() {
            let total = 16; // Base
            for (let i = 2; i <= 5; i++) {
                const b = equipado[`slot-bolsa-${i}`];
                if (b && b.espacios) total += b.espacios;
            }
            return total;
        }

        /**
         * RENDERIZADO DE EQUIPAMIENTO
         */
        function renderEquipado() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach(s => {
                if(s.id !== 'slot-bolsa-1') {
                    s.innerHTML = "";
                    s.style.borderColor = "#475569";
                    s.className = "slot";
                    s.title = "Vacío";
                }
            });

            // Slot fijo de mochila inicial
            const s1 = document.getElementById('slot-bolsa-1');
            if(s1) {
                s1.innerHTML = `<img src="img/equipacion/mochila.jpg" style="opacity:0.6">`;
                s1.style.borderColor = coloresRareza["Common"];
                s1.title = "Mochila de Aventurero (Base)";
            }

            // Cargar objetos equipados
            for (const slotId in equipado) {
                const item = equipado[slotId];
                const target = document.getElementById(slotId);
                if (target && item) {
                    target.innerHTML = `<img src="${getPath(item)}">`;
                    target.style.borderColor = coloresRareza[item.Rareza] || "#475569";
                    target.classList.add(item.Rareza.toLowerCase());
                    target.title = item.n;
                }
            }
        }

        /**
         * RENDERIZADO DE INVENTARIO
         */
        function renderInv() {
            const div = document.getElementById('lista-inv');
            const max = calcularCapacidadMax();
            div.innerHTML = `<p style="grid-column: 1/-1; color:#94a3b8; font-size:13px; margin-bottom:15px">Capacidad de carga: ${inventario.length} / ${max}</p>`;
            
            inventario.forEach((item, i) => {
                const color = coloresRareza[item.Rareza] || "#fff";
                div.innerHTML += `
                    <div class="item-slot ${item.Rareza.toLowerCase()}" onclick="gestionarItem(${i})" title="${item.n}">
                        <img src="${getPath(item)}">
                        <span class="item-name" style="color:${color}">${item.n}</span>
                    </div>`;
            });
            
            // Rellenar huecos vacíos visualmente
            for (let i = inventario.length; i < max; i++) {
                div.innerHTML += `<div class="item-slot" style="opacity:0.1; border-style: dashed;"></div>`;
            }
        }

        /**
         * ACCIONES DE OBJETOS
         */
        function gestionarItem(index) {
            const item = inventario[index];
            if (item.Tipo === "Equipable") {
                if (confirm(`¿Deseas equipar [${item.n}] en el slot de ${item.Slot}?`)) {
                    equipar(index);
                }
            } else {
                if (confirm(`¿Usar o destruir [${item.n}]?`)) {
                    inventario.splice(index, 1);
                    localStorage.setItem('hq_inv', JSON.stringify(inventario));
                    renderInv();
                }
            }
        }

        function equipar(index) {
            const nuevo = inventario[index];
            let slotId = "";

            // Lógica especial para anillos y bolsas
            if (nuevo.Slot === "bolsa") {
                for (let i = 2; i <= 5; i++) {
                    if (!equipado[`slot-bolsa-${i}`]) { slotId = `slot-bolsa-${i}`; break; }
                }
                if (!slotId) slotId = "slot-bolsa-2"; // Reemplaza la primera si todas llenas
            } else if (nuevo.Slot === "anillo") {
                if (!equipado["slot-anillo-1"]) slotId = "slot-anillo-1";
                else if (!equipado["slot-anillo-2"]) slotId = "slot-anillo-2";
                else slotId = "slot-anillo-1";
            } else {
                slotId = "slot-" + nuevo.Slot;
            }

            const actualEnSlot = equipado[slotId];
            if (actualEnSlot) {
                // Intercambio
                inventario[index] = { ...actualEnSlot };
                equipado[slotId] = { ...nuevo };
            } else {
                // Equipar nuevo
                equipado[slotId] = { ...nuevo };
                inventario.splice(index, 1);
            }

            localStorage.setItem('hq_equipo', JSON.stringify(equipado));
            localStorage.setItem('hq_inv', JSON.stringify(inventario));
            renderInv(); renderEquipado();
        }

        function gestionarEquipado(el) {
            if (el.id === "slot-bolsa-1") return;
            const item = equipado[el.id];
            if (item) {
                if (confirm(`¿Quieres desequipar [${item.n}]?`)) {
                    if (inventario.length >= calcularCapacidadMax()) {
                        alert("No tienes espacio en la mochila para desequipar esto.");
                        return;
                    }
                    inventario.push({ ...item });
                    delete equipado[el.id];
                    localStorage.setItem('hq_inv', JSON.stringify(inventario));
                    localStorage.setItem('hq_equipo', JSON.stringify(equipado));
                    renderEquipado(); renderInv();
                }
            }
        }

        function borrarTodo() { 
            if (confirm("¡ATENCIÓN! Esto borrará todos los objetos de tu mochila permanentemente. ¿Continuar?")) { 
                inventario = []; 
                localStorage.setItem('hq_inv', JSON.stringify(inventario)); 
                renderInv(); 
            } 
        }

        // Ejecutar carga inicial
        cargarDatos();
    </script>
</body>
</html>
