<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HeroQuest Pro Edition</title>
    <style>
        /* ESTILOS GENERALES */
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        .tab-content { display: none; padding: 15px; text-align: center; }
        .active-view { display: block; }

        /* NAVEGACIÓN INFERIOR */
        nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: #1e293b; display: flex; justify-content: space-around;
            align-items: center; border-top: 2px solid #334155; z-index: 100;
        }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 10px; font-weight: bold; }
        .nav-btn.active { color: #3b82f6; }
        .nav-btn span { display: block; font-size: 22px; margin-bottom: 2px; }

        /* MAZMORRA Y CARTAS */
        .card { background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid #475569; margin-top: 10px; }
        .card img { 
            width: 100%; 
            height: auto; 
            max-height: 50vh; 
            object-fit: contain; /* Ajusta la foto al cuadro sin recortar */
            display: block;
        }
        .btn-action { background: #ef4444; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 90%; margin: 10px; font-size: 16px; }
        .btn-win { background: #22c55e; }

        /* FICHA DE HÉROE (ESTILO WOW) */
        .hero-container {
            display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px;
            max-width: 400px; margin: auto; padding: 10px;
        }
        .slot-column { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .slot {
            width: 50px; height: 50px; background: rgba(30, 41, 59, 0.8);
            border: 2px solid #475569; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; position: relative;
        }
        .slot::after {
            content: attr(data-label); position: absolute; bottom: -12px;
            font-size: 8px; color: #94a3b8; text-transform: uppercase;
        }
        .silhouette { display: flex; align-items: center; justify-content: center; font-size: 120px; opacity: 0.1; }
        .bottom-slots { grid-column: span 3; display: flex; justify-content: center; gap: 15px; margin-top: 20px; }

        /* MOCHILA */
        .item-row { 
            background: #1e293b; padding: 12px; margin: 8px 0; 
            border-radius: 8px; display: flex; justify-content: space-between; 
            align-items: center; border-left: 4px solid #3b82f6; 
        }
        .btn-reset {
            margin-top: 30px; color: #94a3b8; background: rgba(255,255,255,0.05); 
            border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; font-size: 12px;
        }
    </style>
</head>
<body>

    <section id="vista-mundo" class="tab-content active-view">
        <h2 style="color: #ef4444; font-style: italic;">MAZMORRA</h2>
        <button class="btn-action" onclick="generarEncuentro()">🎲 EXPLORAR</button>
        <div id="pantalla-enemigo" style="display: none;">
            <div class="card">
                <img id="foto-enemigo" src="">
                <h3 id="nombre-enemigo" style="margin: 15px 0 5px 0;"></h3>
                <button id="btn-derrota" class="btn-action btn-win" onclick="derrotar()">⚔️ DERROTADO</button>
                <div id="botin-texto" style="padding: 15px; color: gold; font-weight: bold;"></div>
            </div>
        </div>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6;">FICHA DEL HÉROE</h2>
        <div class="hero-container">
            <div class="slot-column">
                <div class="slot" data-label="Casco">🪖</div>
                <div class="slot" data-label="Hombros">🛡️</div>
                <div class="slot" data-label="Pecho">👕</div>
                <div class="slot" data-label="Guantes">🥊</div>
            </div>
            <div class="silhouette">👤</div>
            <div class="slot-column">
                <div class="slot" data-label="Cuello">📿</div>
                <div class="slot" data-label="Brazos">⚔️</div>
                <div class="slot" data-label="Piernas">👖</div>
                <div class="slot" data-label="Botas">🥾</div>
            </div>
            <div class="bottom-slots">
                <div class="slot" data-label="Anillo">💍</div>
                <div class="slot" data-label="Anillo">💍</div>
                <div class="slot" data-label="Abalorio">🔮</div>
                <div class="slot" data-label="Abalorio">🔮</div>
            </div>
        </div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308;">MOCHILA</h2>
        <div id="lista-inv"></div>
        <button class="btn-reset" onclick="borrarTodo()">🗑️ Vaciar Mochila</button>
    </section>

    <nav>
        <button class="nav-btn active" id="btn-nav-mundo" onclick="cambiarVista('mundo')">
            <span>⚔️</span>MAZMORRA
        </button>
        <button class="nav-btn" id="btn-nav-heroe" onclick="cambiarVista('heroe')">
            <span>🛡️</span>HÉROE
        </button>
        <button class="nav-btn" id="btn-nav-mochila" onclick="cambiarVista('mochila')">
            <span>🎒</span>MOCHILA
        </button>
    </nav>

    <script>
        // 1. BASE DE DATOS DE OBJETOS
        const itemsDB = {
            "oro": { n: "Bolsa de Oro", i: "💰", r: "Común" },
            "pocion": { n: "Poción de Vida", i: "🧪", r: "Raro" },
            "gema": { n: "Gema Roja", i: "💎", r: "Épico" },
            "escama": { n: "Escama de Dragón", i: "🛡️", r: "Legendario" }
        };

        // 2. LISTADO DE ENEMIGOS (Usa tus URLs de ImgBB aquí)
        const enemigos = [
            { n: "Slime", f: "https://i.ibb.co/Z6P8B7V/slime.jpg", b: ["oro", "pocion"] },
            { n: "Orco", f: "https://i.ibb.co/C0m0vLz/orco.jpg", b: ["oro", "gema"] }
        ];

        let inventario = JSON.parse(localStorage.getItem('hq_inv')) || [];
        let actual = null;

        // CAMBIAR PESTAÑAS
        function cambiarVista(donde) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-' + donde).classList.add('active-view');
            document.getElementById('btn-nav-' + donde).classList.add('active');
            if(donde === 'mochila') renderInv();
        }

        // LÓGICA DE EXPLORACIÓN
        function generarEncuentro() {
            actual = enemigos[Math.floor(Math.random() * enemigos.length)];
            document.getElementById('pantalla-enemigo').style.display = 'block';
            document.getElementById('nombre-enemigo').innerText = actual.n;
            document.getElementById('foto-enemigo').src = actual.f;
            document.getElementById('btn-derrota').style.display = 'inline-block';
            document.getElementById('botin-texto').innerText = "";
        }

        // LÓGICA DE RECOMPENSA
        function derrotar() {
            const pool = actual.b;
            const itemKey = pool[Math.floor(Math.random() * pool.length)];
            const itemObtenido = itemsDB[itemKey] || { n: itemKey, i: "📦", r: "Común" };
            
            inventario.push(itemObtenido);
            localStorage.setItem('hq_inv', JSON.stringify(inventario));

            document.getElementById('botin-texto').innerHTML = `${itemObtenido.i} ¡Has ganado ${itemObtenido.n}!`;
            document.getElementById('btn-derrota').style.display = 'none';
        }

        // RENDERIZAR MOCHILA
        function renderInv() {
            const div = document.getElementById('lista-inv');
            if (inventario.length === 0) {
                div.innerHTML = "<p style='color: #64748b; margin-top: 20px;'>Mochila vacía</p>";
                return;
            }

            div.innerHTML = inventario.map((item, index) => {
                const color = { "Común": "#94a3b8", "Raro": "#3b82f6", "Épico": "#a855f7", "Legendario": "#eab308" }[item.r] || "#334155";
                return `
                    <div class="item-row" style="border-left-color: ${color}">
                        <span>${item.i || '📦'} ${item.n || 'Objeto'}</span>
                        <small style="color: #475569">#${index + 1}</small>
                    </div>
                `;
            }).join('');
        }

        // RESETEAR JUEGO
        function borrarTodo() {
            if (confirm("¿Vaciar mochila?")) {
                inventario = [];
                localStorage.removeItem('hq_inv');
                renderInv();
            }
        }
    </script>
</body>
</html>
