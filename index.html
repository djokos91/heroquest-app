<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HeroQuest RPG Engine</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        .tab-content { display: none; padding: 15px; text-align: center; animation: fadeIn 0.3s; }
        .active-view { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #1e293b; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #334155; z-index: 100; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 10px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: #3b82f6; }
        .nav-btn span { display: block; font-size: 22px; margin-bottom: 2px; }
        
        /* ESTILOS MAPA 3x3 */
        #mapa-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 20px auto; }
        .sector { aspect-ratio: 1/1; background: #020617; border: 1px solid #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; transition: 0.3s; }
        .sector.revelado { background: #14532d; border-color: #22c55e; }
        .sector.actual { border-color: #3b82f6; border-width: 3px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .sector.completado { opacity: 0.6; background: #064e3b; }

        /* ESTILOS CIUDAD Y NPC */
        .npc-card { background: #1e293b; border: 1px solid #475569; border-radius: 10px; padding: 15px; margin-bottom: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .rep-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #334155; }

        /* TARJETA ENEMIGO / BOTÍN */
        .card { background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid #475569; margin-top: 10px; padding-bottom: 15px; }
        .card img { width: 100%; max-height: 40vh; object-fit: contain; background: #000; }
        .btn-action { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 90%; margin: 5px; cursor: pointer; }
        .btn-win { background: #22c55e; }

        /* SLOTS E INVENTARIO */
        .hero-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 450px; margin: auto; }
        .slot { width: 48px; height: 48px; background: rgba(30, 41, 59, 0.8); border: 2px solid #475569; border-radius: 8px; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .slot img { width: 90%; height: 90%; object-fit: contain; }
        .slot::after { content: attr(data-label); position: absolute; bottom: 1px; font-size: 6px; color: #94a3b8; width: 100%; text-align: center; }
        
        #lista-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding: 10px; }
        .item-slot { width: 80px; height: 100px; background: #1e293b; border: 2px solid #475569; border-radius: 8px; padding: 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 9px; }
        .item-slot img { width: 40px; height: 40px; margin-bottom: 5px; }

        /* COLORES RAREZA */
        .common { border-color: #ffffff; } .uncommon { border-color: #1eff00; } .rare { border-color: #0070dd; } .epic { border-color: #a335ee; } .legendary { border-color: #ff8000; }
    </style>
</head>
<body>

    <section id="vista-mundo" class="tab-content active-view">
        <h2 style="color: #22c55e;">EXPLORACIÓN</h2>
        <div id="contenedor-mapa">
            <div id="mapa-grid"></div>
            <p id="mapa-info" style="font-size: 12px; color: #94a3b8;">Sectores del Bosque</p>
        </div>
        <div id="pantalla-enemigo" style="display: none;">
            <button class="btn-action" style="background:#475569" onclick="cerrarCombate()">⬅ VOLVER</button>
            <div class="card">
                <img id="enemigo-img" src="">
                <h3 id="enemigo-nombre"></h3>
                <p>Vida: <span id="enemigo-hp" style="color:#ef4444"></span></p>
                <button id="btn-derrota" class="btn-action btn-win" onclick="derrotarEnemigo()">⚔️ VICTORIA</button>
                <div id="botin-texto"></div>
            </div>
        </div>
    </section>

    <section id="vista-ciudad" class="tab-content">
        <h2 id="ciudad-nombre" style="color: #f59e0b;">POBLACIÓN</h2>
        <div id="lista-npcs"></div>
        <button class="btn-action" style="background:#3b82f6; width: auto;" onclick="viajar()">🗺️ VIAJAR A OTRO LUGAR</button>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6;">HÉROE</h2>
        <div class="hero-container">
            <div class="slot-column" style="display:flex; flex-direction:column; gap:8px">
                <div id="slot-cabeza" class="slot" data-label="Cabeza" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pecho" class="slot" data-label="Pecho" onclick="gestionarEquipado(this)"></div>
                <div id="slot-manos" class="slot" data-label="Manos" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pies" class="slot" data-label="Pies" onclick="gestionarEquipado(this)"></div>
            </div>
            <div style="font-size: 80px; opacity: 0.1; display:flex; align-items:center; justify-content:center;">👤</div>
            <div class="slot-column" style="display:flex; flex-direction:column; gap:8px">
                <div id="slot-mano1" class="slot" data-label="Mano 1" onclick="gestionarEquipado(this)"></div>
                <div id="slot-mano2" class="slot" data-label="Mano 2" onclick="gestionarEquipado(this)"></div>
                <div id="slot-anillo-1" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-2" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>
        <div id="slot-bolsa-1" class="slot" data-label="Base" style="margin: 20px auto;" onclick="gestionarEquipado(this)"></div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308;">INVENTARIO</h2>
        <div id="lista-inv"></div>
        
        <div style="margin-top: 30px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 10px; border: 1px dashed #475569;">
            <p style="font-size: 11px; color: #94a3b8;">GESTIÓN DE DATOS (DEBUG)</p>
            <button onclick="exportarPartida()" style="background:#3b82f6; border:none; padding:8px; border-radius:4px; color:white; font-size:10px; cursor:pointer;">💾 EXPORTAR</button>
            <label style="background:#22c55e; padding:8px; border-radius:4px; color:white; font-size:10px; cursor:pointer;">
                📂 IMPORTAR <input type="file" style="display:none" onchange="importarPartida(event)">
            </label>
            <button onclick="borrarTodo()" style="background:#ef4444; border:none; padding:8px; border-radius:4px; color:white; font-size:10px; cursor:pointer;">🗑️ RESET</button>
        </div>
    </section>

    <nav>
        <button class="nav-btn active" onclick="cambiarVista('mundo')"><span>⚔️</span>MAPA</button>
        <button class="nav-btn" onclick="cambiarVista('ciudad')"><span>🏛️</span>CIUDAD</button>
        <button class="nav-btn" onclick="cambiarVista('heroe')"><span>🛡️</span>HÉROE</button>
        <button class="nav-btn" onclick="cambiarVista('mochila')"><span>🎒</span>MOCHILA</button>
    </nav>

    <script>
        // --- VARIABLES GLOBALES ---
        let enemigos = [];
        let itemsDB = {};
        let inventario = JSON.parse(localStorage.getItem('hq_inv')) || [];
        let equipado = JSON.parse(localStorage.getItem('hq_equipo')) || {};
        let enemigoActual = null;

        // --- MOTOR DE ESTADO (GAMESTATE) ---
        window.GameState = {
            world: { location: "Aldea Inicial", discovered: ["Aldea Inicial"], mapaEstado: {} },
            player: { reputation: {}, history: [] },
            activeNPCs: [],

            init() {
                const save = localStorage.getItem('hq_full_save');
                if (save) {
                    const data = JSON.parse(save);
                    this.world = data.world;
                    this.player = data.player;
                }
                this.loadLocation(this.world.location);
            },
            save() {
                localStorage.setItem('hq_full_save', JSON.stringify({ world: this.world, player: this.player }));
                localStorage.setItem('hq_inv', JSON.stringify(window.inventario));
                localStorage.setItem('hq_equipo', JSON.stringify(window.equipado));
            },
            loadLocation(id) {
                this.world.location = id;
                this.activeNPCs = this.generateNPCs(id);
                initMapaLocal(); // Reinicia el 3x3 para la nueva zona
                this.save();
                renderCiudad();
            },
            generateNPCs(locId) {
                const nombres = ["Cedric", "Kael", "Mara", "Grog"];
                const oficios = ["Herrero", "Tabernero", "Alquimista", "Guardia"];
                return [
                    { id: locId+"_1", n: nombres[Math.floor(Math.random()*4)], job: oficios[0] },
                    { id: locId+"_2", n: nombres[Math.floor(Math.random()*4)], job: oficios[1] }
                ];
            }
        };

        // --- LÓGICA DEL MAPA 3x3 ---
        let mapaLocal = { pos: { x: 1, y: 1 }, sectores: [] };

        function initMapaLocal() {
            mapaLocal.sectores = [];
            for (let x = 0; x < 3; x++) {
                mapaLocal.sectores[x] = [];
                for (let y = 0; y < 3; y++) {
                    mapaLocal.sectores[x][y] = { revelado: (x==1 && y==1), completado: false };
                }
            }
            renderMapa();
        }

        function renderMapa() {
            const grid = document.getElementById('mapa-grid');
            grid.innerHTML = "";
            for (let y = 0; y < 3; y++) {
                for (let x = 0; x < 3; x++) {
                    const s = mapaLocal.sectores[x][y];
                    const esActual = (x === mapaLocal.pos.x && y === mapaLocal.pos.y);
                    const div = document.createElement('div');
                    div.className = `sector ${s.revelado ? 'revelado' : ''} ${esActual ? 'actual' : ''} ${s.completado ? 'completado' : ''}`;
                    div.innerHTML = s.revelado ? (esActual ? "🛡️" : (s.completado ? "🌲" : "❓")) : "☁️";
                    div.onclick = () => clicarSector(x, y);
                    grid.appendChild(div);
                }
            }
        }

        function clicarSector(x, y) {
            const dist = Math.abs(x - mapaLocal.pos.x) + Math.abs(y - mapaLocal.pos.y);
            if (x === mapaLocal.pos.x && y === mapaLocal.pos.y) {
                if (!mapaLocal.sectores[x][y].completado) entrarEnCombate();
            } else if (dist === 1) {
                mapaLocal.pos = { x, y };
                mapaLocal.sectores[x][y].revelado = true;
                renderMapa();
            }
        }

        // --- SISTEMA DE CIUDAD ---
        function renderCiudad() {
            document.getElementById('ciudad-nombre').innerText = GameState.world.location;
            const lista = document.getElementById('lista-npcs');
            lista.innerHTML = "";
            GameState.activeNPCs.forEach(npc => {
                const rep = GameState.player.reputation[npc.id] || 0;
                lista.innerHTML += `
                    <div class="npc-card">
                        <div>
                            <strong>${npc.n}</strong><br><small>${npc.job}</small>
                        </div>
                        <div style="text-align:right">
                            <span class="rep-badge">REP: ${rep}</span><br>
                            <button onclick="hablarNPC('${npc.id}')" style="margin-top:5px; cursor:pointer">Hablar</button>
                        </div>
                    </div>`;
            });
        }

        function viajar() {
            const destinos = ["Puerto Seco", "Bastión Ámbar", "Valle Sombrío"];
            const nuevo = destinos[Math.floor(Math.random()*destinos.length)];
            if(confirm(`¿Viajar a ${nuevo}?`)) GameState.loadLocation(nuevo);
        }

        function hablarNPC(id) {
            const npc = GameState.activeNPCs.find(n => n.id === id);
            alert(`${npc.n}: "Bienvenido a ${GameState.world.location}. ¿Buscas trabajo?"`);
            GameState.player.reputation[id] = (GameState.player.reputation[id] || 0) + 1;
            GameState.save();
            renderCiudad();
        }

        // --- COMBATE Y BOTÍN ---
        function entrarEnCombate() {
            if (enemigos.length === 0) return;
            document.getElementById('contenedor-mapa').style.display = 'none';
            document.getElementById('pantalla-enemigo').style.display = 'block';
            enemigoActual = enemigos[Math.floor(Math.random() * enemigos.length)];
            document.getElementById('enemigo-nombre').innerText = enemigoActual.n;
            document.getElementById('enemigo-hp').innerText = enemigoActual.hp;
            document.getElementById('enemigo-img').src = getPath(enemigoActual);
            document.getElementById('botin-texto').innerHTML = "";
            document.getElementById('btn-derrota').style.display = 'block';
        }

        function derrotarEnemigo() {
            if (inventario.length >= 16) { alert("¡Mochila llena!"); return; }
            const posibles = Object.values(itemsDB);
            const drop = { ...posibles[Math.floor(Math.random()*posibles.length)] };
            inventario.push(drop);
            mapaLocal.sectores[mapaLocal.pos.x][mapaLocal.pos.y].completado = true;
            document.getElementById('botin-texto').innerHTML = `¡Obtenido: ${drop.n}!`;
            document.getElementById('btn-derrota').style.display = 'none';
            GameState.save();
        }

        function cerrarCombate() {
            document.getElementById('contenedor-mapa').style.display = 'block';
            document.getElementById('pantalla-enemigo').style.display = 'none';
            renderMapa();
        }

        // --- UTILIDADES ---
        function getPath(it) { return it.subfolder ? `img/${it.subfolder}/${it.f}` : `img/${it.f}`; }

        function cambiarVista(donde) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-' + donde).classList.add('active-view');
            if(donde === 'mochila') renderInv();
            if(donde === 'heroe') renderEquipado();
        }

        function renderEquipado() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach(s => { s.innerHTML = ""; s.className = "slot"; s.title = ""; });
            
            // Mochila base
            const s1 = document.getElementById('slot-bolsa-1');
            s1.innerHTML = `<img src="img/equipacion/mochila.jpg" style="opacity:0.5">`;
            s1.title = "Mochila Base";

            for (const id in equipado) {
                const it = equipado[id];
                const el = document.getElementById(id);
                if (el) {
                    el.innerHTML = `<img src="${getPath(it)}">`;
                    el.classList.add(it.Rareza.toLowerCase());
                    el.title = it.n;
                }
            }
        }

        function renderInv() {
            const lista = document.getElementById('lista-inv');
            lista.innerHTML = "";
            inventario.forEach((it, i) => {
                lista.innerHTML += `
                    <div class="item-slot ${it.Rareza.toLowerCase()}" onclick="gestionarItem(${i})" title="${it.n}">
                        <img src="${getPath(it)}">
                        <span>${it.n}</span>
                    </div>`;
            });
        }

        function gestionarItem(index) {
            const it = inventario[index];
            if (it.Tipo === "Equipable" && confirm(`¿Equipar ${it.n}?`)) {
                const slotId = "slot-" + it.Slot;
                if (equipado[slotId]) inventario[index] = equipado[slotId];
                else inventario.splice(index, 1);
                equipado[slotId] = it;
                GameState.save();
                renderInv();
            }
        }

        function gestionarEquipado(el) {
            const it = equipado[el.id];
            if (it && confirm("¿Desequipar?")) {
                inventario.push(it);
                delete equipado[el.id];
                GameState.save();
                renderEquipado();
            }
        }

        // --- ADMIN ---
        function exportarPartida() {
            const data = { gameState: GameState, inv: inventario, eq: equipado };
            const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "partida.json";
            a.click();
        }

        function importarPartida(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const d = JSON.parse(ev.target.result);
                localStorage.setItem('hq_full_save', JSON.stringify(d.gameState));
                localStorage.setItem('hq_inv', JSON.stringify(d.inv));
                localStorage.setItem('hq_equipo', JSON.stringify(d.eq));
                location.reload();
            };
            reader.readAsText(e.target.files[0]);
        }

        function borrarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }

        // --- CARGA INICIAL ---
        async function cargarJSONs() {
            try {
                const [en, eq, co] = await Promise.all([
                    fetch('enemigos.json').then(r => r.json()),
                    fetch('equipacion.json').then(r => r.json()),
                    fetch('consumibles.json').then(r => r.json())
                ]);
                enemigos = Object.values(en); enemigos.forEach(e => e.subfolder = "enemigos");
                Object.values(eq).forEach(e => e.subfolder = "equipacion");
                Object.values(co).forEach(e => e.subfolder = "consumibles");
                itemsDB = { ...eq, ...co };
                GameState.init();
            } catch(e) { console.error("Error cargando archivos JSON"); GameState.init(); }
        }
        cargarJSONs();
    </script>
</body>
</html>
