<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HeroQuest Pro Edition</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        .tab-content { display: none; padding: 15px; text-align: center; }
        .active-view { display: block; }
        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #1e293b; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #334155; z-index: 100; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 10px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: #3b82f6; }
        .nav-btn span { display: block; font-size: 22px; margin-bottom: 2px; }
        
        /* TARJETA ENEMIGO */
        .card { background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid #475569; margin-top: 10px; padding-bottom: 15px; }
        .card img { width: 100%; height: auto; max-height: 40vh; object-fit: contain; display: block; background: #000; }
        
        .btn-action { background: #ef4444; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 90%; margin: 10px; font-size: 16px; cursor: pointer; }
        .btn-win { background: #22c55e; }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        /* FICHA DE HÉROE */
        .hero-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 450px; margin: auto; padding: 10px; }
        .slot-column { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        .slot { 
            width: 48px; height: 48px; background: rgba(30, 41, 59, 0.8); 
            border: 2px solid #475569; border-radius: 8px; display: flex; 
            align-items: center; justify-content: center; position: relative; 
            overflow: hidden; cursor: pointer; transition: all 0.2s;
        }
        .slot:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .slot img { width: 90%; height: 90%; object-fit: contain; }
        .slot::after { content: attr(data-label); position: absolute; bottom: 1px; font-size: 6px; color: #94a3b8; text-transform: uppercase; width: 100%; text-align: center; background: rgba(0,0,0,0.5); }
        .silhouette { display: flex; align-items: center; justify-content: center; font-size: 100px; opacity: 0.1; }
        .bottom-slots { grid-column: span 3; display: flex; justify-content: center; gap: 10px; margin-top: 15px; }

        /* MOCHILA */
        #lista-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; padding: 10px; max-width: 500px; margin: auto; }
        .item-slot { width: 80px; height: 105px; background: #1e293b; border: 2px solid #475569; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px; cursor: pointer; position: relative; transition: all 0.2s ease; box-sizing: border-box; }
        .item-slot img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 6px; }
        .item-name { font-size: 9px; text-align: center; line-height: 10px; word-wrap: break-word; width: 100%; font-weight: bold; }
        
        /* Rarezas */
        .poor { border-color: #9d9d9d; } .common { border-color: #ffffff; } .uncommon { border-color: #1eff00; } .rare { border-color: #0070dd; } .epic { border-color: #a335ee; } .legendary { border-color: #ff8000; }
        .btn-reset { margin-top: 30px; color: #94a3b8; background: rgba(255,255,255,0.05); border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <section id="vista-mundo" class="tab-content active-view">
        <h2 style="color: #ef4444; font-style: italic;">MAZMORRA</h2>
        <button id="btn-explorar" class="btn-action" onclick="generarEncuentro()" disabled>🎲 EXPLORAR</button>
        <div id="pantalla-enemigo" style="display: none;">
            <div class="card">
                <img id="enemigo-img" src="" alt="Enemigo">
                <h3 id="enemigo-nombre" style="margin: 15px 0 5px 0;"></h3>
                <p style="color: #94a3b8;">Vida: <span id="enemigo-hp" style="color: #ef4444; font-weight: bold;"></span></p>
                <button id="btn-derrota" class="btn-action btn-win" onclick="derrotar()">⚔️ DERROTADO</button>
                <div id="botin-texto" style="padding: 15px; color: gold; font-weight: bold; min-height: 80px;"></div>
            </div>
        </div>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6;">FICHA DEL HÉROE</h2>
        <div class="hero-container">
            <div class="slot-column">
                <div id="slot-cabeza" class="slot" data-label="Cabeza" onclick="gestionarEquipado(this)"></div>
                <div id="slot-cuello" class="slot" data-label="Cuello" onclick="gestionarEquipado(this)"></div>
                <div id="slot-hombros" class="slot" data-label="Hombros" onclick="gestionarEquipado(this)"></div>
                <div id="slot-espalda" class="slot" data-label="Espalda" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pecho" class="slot" data-label="Pecho" onclick="gestionarEquipado(this)"></div>
                <div id="slot-brazos" class="slot" data-label="Brazos" onclick="gestionarEquipado(this)"></div>
                <div id="slot-manos" class="slot" data-label="Manos" onclick="gestionarEquipado(this)"></div>
            </div>
            <div class="silhouette">👤</div>
            <div class="slot-column">
                <div id="slot-cintura" class="slot" data-label="Cintura" onclick="gestionarEquipado(this)"></div>
                <div id="slot-piernas" class="slot" data-label="Piernas" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pies" class="slot" data-label="Pies" onclick="gestionarEquipado(this)"></div>
                <div id="slot-anillo-1" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-anillo-2" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-abalorio-1" class="slot" data-label="Abalorio" onclick="gestionarEquipado(this)"></div>
                <div id="slot-abalorio-2" class="slot" data-label="Abalorio" onclick="gestionarEquipado(this)"></div>
            </div>
            <div class="bottom-slots">
                <div id="slot-mano1" class="slot" data-label="Mano 1" onclick="gestionarEquipado(this)"></div>
                <div id="slot-mano2" class="slot" data-label="Mano 2" onclick="gestionarEquipado(this)"></div>
                <div id="slot-distancia" class="slot" data-label="Rango" onclick="gestionarEquipado(this)"></div>
                <div id="slot-municion" class="slot" data-label="Munición" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <p style="font-size: 11px; color: #94a3b8; margin-bottom: 5px;">CONTENEDORES (BOLSAS)</p>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <div id="slot-bolsa-1" class="slot" data-label="Base" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-2" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-3" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-4" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
                <div id="slot-bolsa-5" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308;">MOCHILA</h2>
        <div id="lista-inv"></div>
        <button class="btn-reset" onclick="borrarTodo()">🗑️ Vaciar Mochila</button>
    </section>

    <nav>
        <button class="nav-btn active" id="btn-nav-mundo" onclick="cambiarVista('mundo')"><span>⚔️</span>MAZMORRA</button>
        <button class="nav-btn" id="btn-nav-heroe" onclick="cambiarVista('heroe')"><span>🛡️</span>HÉROE</button>
        <button class="nav-btn" id="btn-nav-mochila" onclick="cambiarVista('mochila')"><span>🎒</span>MOCHILA</button>
    </nav>

    <script>
        let enemigos = [];
        let itemsDB = {};
        
        let inventario = JSON.parse(localStorage.getItem('hq_inv')) || [];
        let equipado = JSON.parse(localStorage.getItem('hq_equipo')) || {};
        let actual = null;

        const coloresRareza = { "Poor": "#9d9d9d", "Common": "#ffffff", "Uncommon": "#1eff00", "Rare": "#0070dd", "Epic": "#a335ee", "Legendary": "#ff8000" };
        const jerarquiaRareza = { "Poor": 0, "Common": 1, "Uncommon": 2, "Rare": 3, "Epic": 4, "Legendary": 5 };

        // --- FUNCIÓN CLAVE PARA LAS RUTAS ---
        function getPath(item) {
            if (!item || !item.f) return "img/error.jpg";
            // Si el item ya tiene la ruta completa, no la repetimos
            if (item.f.includes('/')) return `img/${item.f}`;
            return `img/${item.subfolder}/${item.f}`;
        }

        async function cargarDatos() {
            try {
                const v = Date.now();
                const [resEn, resEq, resCo, resBa] = await Promise.all([
                    fetch(`enemigos.json?v=${v}`).then(r => r.json()),
                    fetch(`equipacion.json?v=${v}`).then(r => r.json()),
                    fetch(`consumibles.json?v=${v}`).then(r => r.json()),
                    fetch(`basura.json?v=${v}`).then(r => r.json())
                ]);

                // Etiquetamos cada item con su subcarpeta ANTES de unirlos
                Object.values(resEq).forEach(it => it.subfolder = "equipacion");
                Object.values(resCo).forEach(it => it.subfolder = "consumibles");
                Object.values(resBa).forEach(it => it.subfolder = "basura");
                
                enemigos = Object.values(resEn);
                enemigos.forEach(en => en.subfolder = "enemigos");

                itemsDB = { ...resEq, ...resCo, ...resBa };
                
                document.getElementById('btn-explorar').disabled = false;
                renderEquipado();
            } catch (err) { console.error("Error cargando JSON:", err); }
        }
        cargarDatos();

        function cambiarVista(donde) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-' + donde).classList.add('active-view');
            document.getElementById('btn-nav-' + donde).classList.add('active');
            if(donde === 'mochila') renderInv();
            if(donde === 'heroe') renderEquipado();
        }

        function calcularCapacidadMax() {
            let total = 16;
            for (let i = 2; i <= 5; i++) {
                const itemB = equipado[`slot-bolsa-${i}`];
                if (itemB && itemB.espacios) total += itemB.espacios;
            }
            return total;
        }

        function renderEquipado() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach(s => {
                if(s.id !== 'slot-bolsa-1') {
                    s.innerHTML = "";
                    s.style.borderColor = "#475569";
                }
            });

            const s1 = document.getElementById('slot-bolsa-1');
            s1.innerHTML = `<img src="img/mochila.jpg" style="opacity:0.8">`;
            s1.style.borderColor = coloresRareza["Common"];

            for (const slotId in equipado) {
                const item = equipado[slotId];
                const target = document.getElementById(slotId);
                if (target && item) {
                    target.innerHTML = `<img src="${getPath(item)}">`;
                    target.style.borderColor = coloresRareza[item.Rareza] || "#475569";
                }
            }
        }

        function generarEncuentro() {
            actual = enemigos[Math.floor(Math.random() * enemigos.length)];
            document.getElementById('pantalla-enemigo').style.display = 'block';
            document.getElementById('enemigo-nombre').innerText = actual.n;
            document.getElementById('enemigo-hp').innerText = actual.hp;
            document.getElementById('enemigo-img').src = getPath(actual);
            document.getElementById('btn-derrota').style.display = 'inline-block';
            document.getElementById('botin-texto').innerHTML = "";
        }

        function derrotar() {
            const max = calcularCapacidadMax();
            if (inventario.length >= max) { alert("¡Mochila llena!"); return; }
            const nivelMax = jerarquiaRareza[actual.LootTable] || 0;
            const posibles = Object.values(itemsDB).filter(it => (jerarquiaRareza[it.Rareza] || 0) <= nivelMax);
            
            if (posibles.length > 0) {
                const itemObtenido = { ...posibles[Math.floor(Math.random() * posibles.length)] };
                inventario.push(itemObtenido);
                localStorage.setItem('hq_inv', JSON.stringify(inventario));
                
                const color = coloresRareza[itemObtenido.Rareza] || "#fff";
                document.getElementById('botin-texto').innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; gap:5px">
                        ¡BOTÍN!<br>
                        <img src="${getPath(itemObtenido)}" style="width:45px; border:2px solid ${color}; border-radius:5px">
                        <span style="color:${color}">${itemObtenido.n}</span>
                    </div>`;
                document.getElementById('btn-derrota').style.display = 'none';
            }
        }

        function renderInv() {
            const div = document.getElementById('lista-inv');
            const max = calcularCapacidadMax();
            div.innerHTML = `<p style="grid-column: 1/-1; color:#94a3b8; font-size:12px; margin-bottom:10px">Espacio: ${inventario.length} / ${max}</p>`;
            
            inventario.forEach((item, i) => {
                const color = coloresRareza[item.Rareza] || "#fff";
                div.innerHTML += `
                    <div class="item-slot ${item.Rareza.toLowerCase()}" onclick="gestionarItem(${i})">
                        <img src="${getPath(item)}">
                        <span class="item-name" style="color:${color}">${item.n}</span>
                    </div>`;
            });
            for (let i = inventario.length; i < max; i++) {
                div.innerHTML += `<div class="item-slot" style="opacity:0.15"></div>`;
            }
        }

        function gestionarItem(index) {
            const item = inventario[index];
            if (item.Tipo === "Equipable" && confirm(`¿Equipar ${item.n}?`)) equipar(index);
            else if (confirm(`¿Eliminar o usar ${item.n}?`)) {
                inventario.splice(index, 1);
                localStorage.setItem('hq_inv', JSON.stringify(inventario));
                renderInv();
            }
        }

        function equipar(index) {
            const item = inventario[index];
            let slotId = "";

            if (item.Slot === "bolsa") {
                for (let i = 2; i <= 5; i++) {
                    if (!equipado[`slot-bolsa-${i}`]) { slotId = `slot-bolsa-${i}`; break; }
                }
            } else if (item.Slot === "anillo") {
                slotId = !equipado["slot-anillo-1"] ? "slot-anillo-1" : "slot-anillo-2";
            } else {
                slotId = "slot-" + item.Slot;
            }

            if (slotId && !equipado[slotId]) {
                equipado[slotId] = item;
                localStorage.setItem('hq_equipo', JSON.stringify(equipado));
                inventario.splice(index, 1);
                localStorage.setItem('hq_inv', JSON.stringify(inventario));
                renderInv(); renderEquipado();
            } else alert("Espacio ocupado o inválido.");
        }

        function gestionarEquipado(el) {
            if (el.id === "slot-bolsa-1") { alert("La mochila principal no se puede quitar."); return; }
            const item = equipado[el.id];
            if (item && confirm("¿Desequipar objeto?")) {
                if (inventario.length >= calcularCapacidadMax()) { alert("Mochila llena."); return; }
                inventario.push({ ...item });
                localStorage.setItem('hq_inv', JSON.stringify(inventario));
                delete equipado[el.id];
                localStorage.setItem('hq_equipo', JSON.stringify(equipado));
                renderEquipado(); renderInv();
            }
        }

        function borrarTodo() { if (confirm("¿Vaciar mochila?")) { inventario = []; localStorage.removeItem('hq_inv'); renderInv(); } }
    </script>
</body>
</html>
