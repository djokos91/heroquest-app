<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>HeroQuest Pro - Multidivisa</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { display: none; padding: 15px; text-align: center; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-view { display: block; }

        nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #1e293b; display: flex; justify-content: space-around; 
            align-items: center; border-top: 2px solid #334155; z-index: 1000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; transition: all 0.2s; }
        .nav-btn.active { color: #3b82f6; transform: translateY(-2px); }
        .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }

        /* --- MONEDERO TRIPLE --- */
        .wallet-container {
            background: #020617; border: 2px solid #334155; border-radius: 12px;
            padding: 10px 15px; margin: 15px auto; display: flex; justify-content: center; gap: 15px;
            max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .coin-unit { display: flex; align-items: center; gap: 5px; font-weight: bold; font-family: 'Courier New', monospace; font-size: 18px; }
        .c-gold { color: #fbbf24; }
        .c-silver { color: #cbd5e1; }
        .c-bronze { color: #d97706; }

        /* --- PUEBLO --- */
        #contenedor-pueblo { width: 100%; max-width: 600px; margin: auto; }
        .town-card { background: #1e293b; border-radius: 20px; padding: 20px; position: relative; border: 1px solid #334155; margin-bottom: 10px; }
        .btn-refresh-town { 
            position: absolute; right: 15px; top: 15px; background: #334155; 
            border: 1px solid #475569; color: #cbd5e1; padding: 6px 12px; 
            border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold;
        }
        .edificios-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; padding: 10px; }
        .edificio-card { background: #1e293b; border: 1px solid #475569; border-radius: 12px; padding: 15px 5px; cursor: pointer; }
        .npc-item { background: rgba(0,0,0,0.2); margin: 8px 0; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 4px solid #3b82f6; }

        /* --- AVENTURA Y SLOTS --- */
        #mapa-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 20px auto; }
        .sector { aspect-ratio: 1/1; background: #020617; border: 2px solid #334155; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; }
        .sector.actual { border-color: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .hero-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 480px; margin: auto; padding: 15px; }
        .slot { width: 54px; height: 54px; background: rgba(30, 41, 59, 0.9); border: 2px solid #475569; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; }
        .slot::after { content: attr(data-label); position: absolute; bottom: 0; font-size: 7px; color: #94a3b8; width: 100%; text-align: center; background: rgba(0,0,0,0.5); }
        .btn-aventura { width: 100%; background: #ea580c; color: white; border: none; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .card { background: #1e293b; border-radius: 20px; overflow: hidden; border: 2px solid #475569; margin-top: 15px; padding-bottom: 20px; }
        .card img { width: 100%; height: 250px; object-fit: contain; background: black; }
        .item-slot { width: 85px; height: 110px; background: #1e293b; border: 2px solid #475569; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
        #lista-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 15px; padding: 15px; }
    </style>
</head>
<body>

    <section id="vista-mundo" class="tab-content active-view">
        <div id="contenedor-pueblo">
            <div class="town-card">
                <button class="btn-refresh-town" onclick="confirmarNuevaPoblacion()">🔄 REFUNDAR</button>
                <div class="town-type" id="pueblo-tipo"></div>
                <h2 id="pueblo-nombre" style="color: #fbbf24; margin: 5px 0 20px 0; font-size: 28px;"></h2>
                <div class="edificios-grid" id="lista-edificios"></div>
                <h3 style="font-size: 14px; color: #94a3b8; text-align: left; margin: 20px 0 10px 10px;">👥 HABITANTES</h3>
                <div id="lista-npcs"></div>
                <button class="btn-aventura" onclick="irDeAventura()">💀 SALIR DE AVENTURA</button>
            </div>
        </div>

        <div id="contenedor-aventura" style="display:none;">
            <h2 style="color: #22c55e;">EXPLORACIÓN</h2>
            <div id="mapa-grid"></div>
            <button class="btn-aventura" style="background:#334155" onclick="volverAlPueblo()">🏳️ RETIRADA</button>
        </div>

        <div id="pantalla-enemigo" style="display: none;">
            <div class="card">
                <img id="enemigo-img" src="" alt="Enemigo">
                <h3 id="enemigo-nombre" style="color: #f87171;"></h3>
                <p>Vida: <span id="enemigo-hp" style="color: #ef4444;"></span></p>
                <button class="btn-aventura" id="btn-derrota" onclick="derrotarEnemigo()">⚔️ ATACAR</button>
                <div id="botin-texto" style="margin: 10px; font-weight: bold; color: #fbbf24;"></div>
                <button class="btn-aventura" style="background:#334155" onclick="cerrarCombate()">CONTINUAR</button>
            </div>
        </div>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6;">HÉROE</h2>
        
        <div class="wallet-container">
            <div class="coin-unit c-gold"><span id="w-oro">0</span> 🟡</div>
            <div class="coin-unit c-silver"><span id="w-plata">0</span> ⚪</div>
            <div class="coin-unit c-bronze"><span id="w-bronce">0</span> 🟤</div>
        </div>

        <div class="hero-container">
            <div class="slot-column">
                <div id="slot-cabeza" class="slot" data-label="Cabeza" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pecho" class="slot" data-label="Pecho" onclick="gestionarEquipado(this)"></div>
                <div id="slot-manos" class="slot" data-label="Manos" onclick="gestionarEquipado(this)"></div>
            </div>
            <div style="font-size: 100px; opacity: 0.1;">👤</div>
            <div class="slot-column">
                <div id="slot-piernas" class="slot" data-label="Piernas" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pies" class="slot" data-label="Pies" onclick="gestionarEquipado(this)"></div>
                <div id="slot-mano1" class="slot" data-label="Mano 1" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>
        
        <div id="quest-log-container" style="text-align:left; background:rgba(0,0,0,0.3); padding:15px; border-radius:15px; margin-top:20px;"></div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308;">MOCHILA</h2>
        <div id="lista-inv"></div>
        <button style="color:#ef4444; background:none; border:1px solid #ef4444; padding:10px; border-radius:8px; margin-top:20px;" onclick="borrarTodo()">RESETEAR TODO</button>
    </section>

    <nav>
        <button class="nav-btn active" onclick="cambiarVista('mundo')"><span>🌍</span>MUNDO</button>
        <button class="nav-btn" onclick="cambiarVista('heroe')"><span>🛡️</span>HÉROE</button>
        <button class="nav-btn" onclick="cambiarVista('mochila')"><span>🎒</span>MOCHILA</button>
    </nav>

    <script>
        // --- CONSTANTES DE GENERACIÓN ---
        const T_NOMBRES = ["Rocanegra", "Bastión del Rey", "Valle de Oro", "Puerto Gélido", "Aldea Sombra"];
        const T_TIPOS = ["Asentamiento Minero", "Poblado Agrícola", "Ciudadela Fronteriza", "Refugio"];
        const N_NPCs = ["Grimm", "Lia", "Kael", "Barda", "Soren", "Mina"];
        const J_NPCs = ["Herrero", "Alquimista", "Tabernero", "Explorador"];

        // --- ESTADO ---
        let totalBronce = parseInt(localStorage.getItem('hq_total_bronce')) || 0;
        let inventario = JSON.parse(localStorage.getItem('hq_inv')) || [];
        let equipado = JSON.parse(localStorage.getItem('hq_equipo')) || {};
        let misionesActivas = JSON.parse(localStorage.getItem('hq_quests')) || [];
        let puebloActual = JSON.parse(localStorage.getItem('hq_pueblo')) || null;
        let enCombate = false, modoAventura = false;
        let pos = {x:1, y:1};
        let enemigos = [], itemsDB = {};

        // --- MONEDERO (100:1) ---
        function actualizarMonedasUI() {
            const oro = Math.floor(totalBronce / 10000);
            const plata = Math.floor((totalBronce % 10000) / 100);
            const bronce = totalBronce % 100;

            document.getElementById('w-oro').innerText = oro;
            document.getElementById('w-plata').innerText = plata;
            document.getElementById('w-bronce').innerText = bronce;
            localStorage.setItem('hq_total_bronce', totalBronce);
        }

        // --- GESTIÓN DE PUEBLO ---
        function generarPueblo() {
            const numNpcs = 2 + Math.floor(Math.random() * 2);
            let npcs = [];
            for(let i=0; i<numNpcs; i++) {
                npcs.push({
                    n: N_NPCs[Math.floor(Math.random()*N_NPCs.length)],
                    job: J_NPCs[Math.floor(Math.random()*J_NPCs.length)],
                    mision: { meta: 3, recompensa: 250, n: "Limpieza de Sótano" }
                });
            }
            puebloActual = {
                nombre: T_NOMBRES[Math.floor(Math.random()*T_NOMBRES.length)],
                tipo: T_TIPOS[Math.floor(Math.random()*T_TIPOS.length)],
                edificios: [{n:"Forja", icono:"⚒️"}, {n:"Tienda", icono:"⚖️"}],
                npcs: npcs
            };
            localStorage.setItem('hq_pueblo', JSON.stringify(puebloActual));
            renderPueblo();
        }

        function confirmarNuevaPoblacion() {
            if(confirm("¿Quieres refundar el pueblo? Perderás las misiones actuales.")) {
                misionesActivas = [];
                localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
                generarPueblo();
            }
        }

        function renderPueblo() {
            if(!puebloActual) generarPueblo();
            document.getElementById('pueblo-nombre').innerText = puebloActual.nombre;
            document.getElementById('pueblo-tipo').innerText = puebloActual.tipo;
            
            document.getElementById('lista-edificios').innerHTML = puebloActual.edificios.map(ed => `
                <div class="edificio-card">
                    <span style="font-size:24px;">${ed.icono}</span><br>
                    <span style="font-size:11px;">${ed.n}</span>
                </div>`).join("");

            document.getElementById('lista-npcs').innerHTML = puebloActual.npcs.map((npc, idx) => {
                const q = misionesActivas.find(m => m.owner === npc.n);
                let mark = q ? (q.actual >= q.meta ? '✅' : '❓') : '❕';
                return `
                    <div class="npc-item" onclick="hablarNPC(${idx})">
                        <div><b>${npc.n}</b><br><small>${npc.job}</small></div>
                        <span style="font-size:20px;">${mark}</span>
                    </div>`;
            }).join("");
        }

        function hablarNPC(idx) {
            const npc = puebloActual.npcs[idx];
            const activa = misionesActivas.find(m => m.owner === npc.n);

            if(activa) {
                if(activa.actual >= activa.meta) {
                    alert("¡Gracias! Toma tu recompensa.");
                    totalBronce += activa.recompensa;
                    misionesActivas = misionesActivas.filter(m => m.owner !== npc.n);
                    actualizarMonedasUI();
                } else {
                    alert(`Aún te faltan ${activa.meta - activa.actual} enemigos.`);
                }
            } else {
                if(confirm(`¿Me ayudas con ${npc.mision.n}? (+${npc.mision.recompensa} bronce)`)) {
                    misionesActivas.push({ owner: npc.n, meta: npc.mision.meta, actual: 0, recompensa: npc.mision.recompensa, n: npc.mision.n });
                }
            }
            localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
            renderPueblo();
        }

        // --- SISTEMA DE COMBATE ---
        function irDeAventura() {
            modoAventura = true;
            document.getElementById('contenedor-pueblo').style.display = 'none';
            document.getElementById('contenedor-aventura').style.display = 'block';
            renderMapa();
        }

        function renderMapa() {
            const grid = document.getElementById('mapa-grid');
            grid.innerHTML = "";
            for(let y=0; y<3; y++) {
                for(let x=0; x<3; x++) {
                    const d = document.createElement('div');
                    d.className = `sector ${x===pos.x && y===pos.y ? 'actual' : ''}`;
                    d.innerHTML = x===pos.x && y===pos.y ? "👤" : "🌲";
                    d.onclick = () => {
                        if(Math.abs(x-pos.x) + Math.abs(y-pos.y) === 1) {
                            pos = {x, y};
                            if(Math.random() > 0.4) iniciarCombate();
                            renderMapa();
                        }
                    };
                    grid.appendChild(d);
                }
            }
        }

        function iniciarCombate() {
            enCombate = true;
            document.getElementById('contenedor-aventura').style.display = 'none';
            document.getElementById('pantalla-enemigo').style.display = 'block';
            document.getElementById('enemigo-nombre').innerText = "Lobo Hambriento";
            document.getElementById('enemigo-hp').innerText = "15";
            document.getElementById('enemigo-img').src = "https://via.placeholder.com/300x250/ef4444/ffffff?text=ENEMIGO";
            document.getElementById('btn-derrota').style.display = 'block';
            document.getElementById('botin-texto').innerText = "";
        }

        function derrotarEnemigo() {
            const botin = 10 + Math.floor(Math.random()*10);
            totalBronce += botin;
            misionesActivas.forEach(m => { if(m.actual < m.meta) m.actual++; });
            document.getElementById('botin-texto').innerText = `¡Victoria! +${botin} monedas de bronce`;
            document.getElementById('btn-derrota').style.display = 'none';
            actualizarMonedasUI();
            localStorage.setItem('hq_quests', JSON.stringify(misionesActivas));
        }

        function cerrarCombate() {
            enCombate = false;
            document.getElementById('pantalla-enemigo').style.display = 'none';
            document.getElementById('contenedor-aventura').style.display = 'block';
        }

        function volverAlPueblo() {
            modoAventura = false;
            document.getElementById('contenedor-pueblo').style.display = 'block';
            document.getElementById('contenedor-aventura').style.display = 'none';
            renderPueblo();
        }

        // --- NAVEGACIÓN ---
        function cambiarVista(v) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-view'));
            document.getElementById('vista-'+v).classList.add('active-view');
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.toggle('active', (v === 'mundo' && i === 0) || (v === 'heroe' && i === 1) || (v === 'mochila' && i === 2));
            });
            if(v === 'heroe') {
                actualizarMonedasUI();
                renderQuests();
            }
        }

        function renderQuests() {
            const container = document.getElementById('quest-log-container');
            container.innerHTML = "<h4>MISIONES ACTIVAS</h4>" + misionesActivas.map(m => `
                <div style="font-size:12px; margin-bottom:8px; border-bottom:1px solid #444;">
                    <b>${m.n}</b> (${m.actual}/${m.meta})<br>
                    <small>Encargado por: ${m.owner}</small>
                </div>`).join("");
        }

        function borrarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }

        // --- INICIO ---
        renderPueblo();
        actualizarMonedasUI();
    </script>
</body>
</html>
