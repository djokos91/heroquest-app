<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>HeroQuest Pro - Town Update</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { 
            display: none; 
            padding: 15px; 
            text-align: center; 
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-view { display: block; }

        nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #1e293b; display: flex; justify-content: space-around; 
            align-items: center; border-top: 2px solid #334155; z-index: 1000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn { 
            background: none; border: none; color: #94a3b8; 
            font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; 
        }
        .nav-btn.active { color: #3b82f6; transform: translateY(-2px); }
        .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }
        
        /* --- SISTEMA DE MAPA (GRID) --- */
        #contenedor-aventura { width: 100%; max-width: 500px; margin: auto; display: none; }
        #mapa-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; max-width: 320px; margin: 20px auto; padding: 10px;
        }
        .sector {
            aspect-ratio: 1/1; background: #020617; border: 2px solid #334155;
            border-radius: 15px; display: flex; align-items: center;
            justify-content: center; font-size: 32px; cursor: pointer; position: relative;
        }
        .sector.revelado { background: #064e3b; border-color: #22c55e; }
        .sector.actual { 
            border-color: #3b82f6; border-width: 3px; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); transform: scale(1.08); z-index: 10; 
        }
        .sector.completado { opacity: 0.6; background: #1e293b; border-color: #475569; }

        /* --- SISTEMA DE PUEBLO --- */
        #contenedor-pueblo { width: 100%; max-width: 600px; margin: auto; }
        .town-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .town-type { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 3px; }
        
        /* Grid de Edificios */
        .edificios-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px; padding: 10px;
        }
        .edificio-card {
            background: #1e293b; border: 1px solid #475569; border-radius: 12px;
            padding: 15px 5px; cursor: pointer; transition: 0.2s;
        }
        .edificio-card:active { transform: scale(0.95); background: #334155; }
        .edificio-icon { font-size: 30px; display: block; margin-bottom: 5px; }
        .edificio-name { font-size: 12px; font-weight: bold; color: #e2e8f0; }

        /* Lista de NPCs */
        .npc-list { margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; }
        .npc-item { 
            padding: 10px; border-bottom: 1px solid #334155; display: flex; 
            justify-content: space-between; align-items: center; 
        }
        .npc-item:last-child { border-bottom: none; }
        .npc-role { font-size: 10px; color: #94a3b8; text-transform: uppercase; background: #0f172a; padding: 2px 6px; border-radius: 4px; }

        .btn-aventura {
            width: 90%; background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: white; border: none; padding: 20px; font-size: 18px; font-weight: bold;
            border-radius: 15px; margin-top: 20px; cursor: pointer;
            box-shadow: 0 4px 0 #7c2d12; text-transform: uppercase;
        }
        .btn-aventura:active { transform: translateY(4px); box-shadow: none; }

        /* --- INTERFAZ DE COMBATE --- */
        .card { 
            background: #1e293b; border-radius: 20px; overflow: hidden; 
            border: 2px solid #475569; margin-top: 15px; padding-bottom: 20px;
        }
        .card img { width: 100%; height: auto; max-height: 45vh; object-fit: contain; background: radial-gradient(circle, #334155 0%, #000 100%); }
        .btn-action { 
            background: #ef4444; color: white; border: none; padding: 18px; border-radius: 12px; 
            font-weight: 900; width: 90%; margin: 10px; font-size: 18px; cursor: pointer; 
            text-transform: uppercase; box-shadow: 0 4px 0 #991b1b;
        }
        .btn-win { background: #22c55e; box-shadow: 0 4px 0 #166534; }

        /* --- FICHA DE HÉROE --- */
        .hero-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 480px; margin: auto; padding: 15px; background: rgba(15, 23, 42, 0.5); border-radius: 20px; }
        .slot-column { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .slot { 
            width: 54px; height: 54px; background: rgba(30, 41, 59, 0.9); border: 2px solid #475569; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            position: relative; overflow: hidden; cursor: pointer; 
        }
        .slot img { width: 82%; height: 82%; object-fit: contain; z-index: 2; margin-bottom: 6px; }
        .slot::after { 
            content: attr(data-label); position: absolute; bottom: 0; font-size: 7px; 
            color: #94a3b8; text-transform: uppercase; width: 100%; text-align: center; 
            background: rgba(0,0,0,0.8); z-index: 1; padding: 1px 0; pointer-events: none;
        }
        .silhouette { font-size: 120px; opacity: 0.05; display: flex; align-items: center; justify-content: center; }
        .bottom-slots { grid-column: span 3; display: flex; justify-content: center; gap: 12px; margin-top: 15px; }

        /* --- INVENTARIO --- */
        #lista-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 15px; padding: 15px; max-width: 550px; margin: auto; }
        .item-slot { 
            width: 85px; height: 110px; background: #1e293b; border: 2px solid #475569; 
            border-radius: 10px; display: flex; flex-direction: column; align-items: center; 
            justify-content: space-between; padding: 8px; cursor: pointer; box-sizing: border-box;
        }
        .item-slot img { width: 50px; height: 50px; object-fit: contain; }
        .item-name { font-size: 10px; text-align: center; font-weight: bold; width: 100%; }
        
        /* Rarezas */
        .poor { border-color: #9d9d9d !important; } .common { border-color: #ffffff !important; }
        .uncommon { border-color: #1eff00 !important; } .rare { border-color: #0070dd !important; }
        .epic { border-color: #a335ee !important; } .legendary { border-color: #ff8000 !important; }
        
        .btn-reset { margin: 40px auto; color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 12px 25px; border-radius: 8px; cursor: pointer; display: block; }
    </style>
</head>
<body>

    <section id="vista-mundo" class="tab-content active-view">
        <div id="contenedor-pueblo">
            <div class="town-header">
                <div class="town-type" id="pueblo-tipo"></div>
                <h2 style="color: #fbbf24; margin: 5px 0; font-size: 28px;" id="pueblo-nombre"></h2>
            </div>

            <h3 style="font-size: 14px; color: #94a3b8; text-align: left; margin-left: 10px;">🏛️ EDIFICIOS</h3>
            <div class="edificios-grid" id="lista-edificios"></div>

            <h3 style="font-size: 14px; color: #94a3b8; text-align: left; margin-left: 10px; margin-top: 20px;">👥 HABITANTES</h3>
            <div class="npc-list" id="lista-npcs"></div>

            <button class="btn-aventura" onclick="irDeAventura()">💀 SALIR DE AVENTURA</button>
        </div>

        <div id="contenedor-aventura">
            <h2 style="color: #22c55e; font-style: italic;">BOSQUE OSCURO</h2>
            <div id="mapa-grid"></div>
            <button class="btn-action btn-back" style="background: #334155; box-shadow: 0 4px 0 #1e293b;" onclick="volverAlPueblo()">🏳️ HUIR AL PUEBLO</button>
        </div>

        <div id="pantalla-enemigo" style="display: none;">
            <div class="card">
                <img id="enemigo-img" src="" alt="Enemigo">
                <div style="padding: 15px;">
                    <h3 id="enemigo-nombre" style="margin: 5px 0; font-size: 24px; color: #f87171;"></h3>
                    <p style="color: #94a3b8;">Vida: <span id="enemigo-hp" style="color: #ef4444; font-weight: bold;"></span></p>
                </div>
                <button id="btn-derrota" class="btn-action btn-win" onclick="derrotarEnemigo()">⚔️ VICTORIA</button>
                <div id="botin-texto" style="padding: 20px; color: #fbbf24; font-weight: bold; min-height: 50px;"></div>
                <button class="btn-action btn-back" onclick="cerrarCombate()">VOLVER AL MAPA</button>
            </div>
        </div>
    </section>

    <section id="vista-heroe" class="tab-content">
        <h2 style="color: #3b82f6;">FICHA DE PERSONAJE</h2>
        <div class="hero-container">
            <div class="slot-column">
                <div id="slot-cabeza" class="slot" data-label="Cabeza" onclick="gestionarEquipado(this)"></div>
                <div id="slot-cuello" class="slot" data-label="Cuello" onclick="gestionarEquipado(this)"></div>
                <div id="slot-hombros" class="slot" data-label="Hombros" onclick="gestionarEquipado(this)"></div>
                <div id="slot-espalda" class="slot" data-label="Espalda" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pecho" class="slot" data-label="Pecho" onclick="gestionarEquipado(this)"></div>
                <div id="slot-brazos" class="slot" data-label="Brazos" onclick="gestionarEquipado(this)"></div>
                <div id="slot-manos" class="slot" data-label="Manos" onclick="gestionarEquipado(this)"></div>
            </div>
            <div class="silhouette">👤</div>
            <div class="slot-column">
                <div id="slot-cintura" class="slot" data-label="Cintura" onclick="gestionarEquipado(this)"></div>
                <div id="slot-piernas" class="slot" data-label="Piernas" onclick="gestionarEquipado(this)"></div>
                <div id="slot-pies" class="slot" data-label="Pies" onclick="gestionarEquipado(this)"></div>
                <div id="slot-anillo-1" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-anillo-2" class="slot" data-label="Anillo" onclick="gestionarEquipado(this)"></div>
                <div id="slot-abalorio-1" class="slot" data-label="Abalorio" onclick="gestionarEquipado(this)"></div>
                <div id="slot-abalorio-2" class="slot" data-label="Abalorio" onclick="gestionarEquipado(this)"></div>
            </div>
            <div class="bottom-slots">
                <div id="slot-mano1" class="slot" data-label="Mano 1" onclick="gestionarEquipado(this)"></div>
                <div id="slot-mano2" class="slot" data-label="Mano 2" onclick="gestionarEquipado(this)"></div>
                <div id="slot-distancia" class="slot" data-label="Rango" onclick="gestionarEquipado(this)"></div>
                <div id="slot-municion" class="slot" data-label="Munición" onclick="gestionarEquipado(this)"></div>
            </div>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 5px; justify-content: center;">
             <div id="slot-bolsa-1" class="slot" data-label="Base" onclick="gestionarEquipado(this)"></div>
             <div id="slot-bolsa-2" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
             <div id="slot-bolsa-3" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
             <div id="slot-bolsa-4" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
             <div id="slot-bolsa-5" class="slot" data-label="Bolsa" onclick="gestionarEquipado(this)"></div>
        </div>
    </section>

    <section id="vista-mochila" class="tab-content">
        <h2 style="color: #eab308;">INVENTARIO</h2>
        <div id="lista-inv"></div>
        <button class="btn-reset" onclick="borrarTodo()">⚠️ ELIMINAR TODO</button>
    </section>

    <nav>
        <button class="nav-btn active" id="btn-nav-mundo" onclick="cambiarVista('mundo')"><span>🌍</span>MUNDO</button>
        <button class="nav-btn" id="btn-nav-heroe" onclick="cambiarVista('heroe')"><span>🛡️</span>HÉROE</button>
        <button class="nav-btn" id="btn-nav-mochila" onclick="cambiarVista('mochila')"><span>🎒</span>MOCHILA</button>
    </nav>

    <script>
        // --- DATOS GLOBALES ---
        const coloresRareza = { "Poor": "#9d9d9d", "Common": "#ffffff", "Uncommon": "#1eff00", "Rare": "#0070dd", "Epic": "#a335ee", "Legendary": "#ff8000" };
        const jerarquiaRareza = { "Poor": 0, "Common": 1, "Uncommon": 2, "Rare": 3, "Epic": 4, "Legendary": 5 };

        // --- BASES DE DATOS GENERATIVAS ---
        const prefijosPueblo = ["Val", "Roca", "Bosque", "Puerto", "Monte", "Rio", "Fuerte", "Aldea", "Villa"];
        const sufijosPueblo = ["mar", "luz", "sombra", "frio", "verde", "ferreo", "alto", "bajo", "piedra"];
        
        const dbEdificios = [
            { id: "posada", n: "Posada", icono: "🍺", minType: 0 },
            { id: "herrero", n: "Herrería", icono: "⚒️", minType: 0 },
            { id: "tienda", n: "Mercader", icono: "⚖️", minType: 1 },
            { id: "templo", n: "Templo", icono: "⛪", minType: 1 },
            { id: "gremio", n: "Gremio", icono: "📜", minType: 2 },
            { id: "torre", n: "Torre Mágica", icono: "🔮", minType: 2 },
            { id: "establo", n: "Establos", icono: "🐴", minType: 1 },
            { id: "cuartel", n: "Cuartel", icono: "🏰", minType: 2 }
        ];

        const nombresNPC = ["Borg", "Ana", "Thorin", "Elena", "Grom", "Syla", "Kael", "Mira", "Otto"];
        const oficiosNPC = ["Tabernero", "Herrero", "Guardia", "Mercader", "Sacerdote", "Borracho", "Granjero", "Mago"];

        // --- ESTADO DEL JUEGO ---
        let enemigos = [];
        let itemsDB = {};
        let inventario = safeParse('hq_inv', []);
        let equipado = safeParse('hq_equipo', {});
        
        // Estado de Mapa y Pueblo
        let puebloActual = safeParse('hq_pueblo', null);
        let modoAventura = false;
        let mundo = { dimension: 3, sectores: [], pos: { x: 1, y: 1 } };
        let actual = null; // Enemigo actual

        function safeParse(key, defaultVal) {
            try { return JSON.parse(localStorage.getItem(key)) || defaultVal; } catch { return defaultVal; }
        }

        function getPath(item) {
            if (!item || !item.f) return "img/error.jpg";
            return item.f.includes('/') ? `img/${item.f}` : `img/${item.subfolder}/${item.f}`;
        }

        // --- GENERADOR DE PUEBLOS ---
        function generarPoblacion() {
            // 0: Aldea, 1: Pueblo, 2: Ciudad
            const tipoRoll = Math.random();
            let tipoId = 0;
            if (tipoRoll > 0.6) tipoId = 1;
            if (tipoRoll > 0.9) tipoId = 2;

            const tipos = ["Aldea", "Pueblo", "Ciudad"];
            const nombre = prefijosPueblo[Math.floor(Math.random() * prefijosPueblo.length)] + 
                           sufijosPueblo[Math.floor(Math.random() * sufijosPueblo.length)];
            
            // Generar Edificios
            let edificios = dbEdificios.filter(e => e.minType <= tipoId);
            // Aleatoriedad: A veces faltan edificios en aldeas
            if (tipoId === 0) edificios = edificios.filter(() => Math.random() > 0.2);

            // Generar NPCs
            const cantidadNPC = (tipoId + 1) * 2 + Math.floor(Math.random() * 3);
            let habitantes = [];
            for(let i=0; i<cantidadNPC; i++) {
                habitantes.push({
                    n: nombresNPC[Math.floor(Math.random() * nombresNPC.length)],
                    job: oficiosNPC[Math.floor(Math.random() * oficiosNPC.length)]
                });
            }

            puebloActual = {
                nombre: nombre,
                tipo: tipos[tipoId],
                edificios: edificios,
                npcs: habitantes
            };
            localStorage.setItem('hq_pueblo', JSON.stringify(puebloActual));
        }

        function renderPueblo() {
            if (!puebloActual) generarPoblacion();
            
            document.getElementById('pueblo-nombre').innerText = puebloActual.nombre;
            document.getElementById('pueblo-tipo').innerText = puebloActual.tipo;
            
            const grid = document.getElementById('lista-edificios');
            grid.innerHTML = "";
            puebloActual.edificios.forEach(ed => {
                grid.innerHTML += `
                    <div class="edificio-card" onclick="alert('Entrando en ${ed.n} (Próximamente)')">
                        <span class="edificio-icon">${ed.icono}</span>
                        <span class="edificio-name">${ed.n}</span>
                    </div>`;
            });

            const listaNpc = document.getElementById('lista-npcs');
            listaNpc.innerHTML = "";
            puebloActual.npcs.forEach(npc => {
                listaNpc.innerHTML += `
                    <div class="npc-item">
                        <span style="font-weight:bold; font-size:14px">${npc.n}</span>
                        <span class="npc-role">${npc.job}</span>
                    </div>`;
            });
        }

        // --- SISTEMA DE AVENTURA ---
        function irDeAventura() {
            modoAventura = true;
            document.getElementById('contenedor-pueblo').style.display = 'none';
            document.getElementById('contenedor-aventura').style.display = 'block';
            initMapa();
        }

        function volverAlPueblo() {
            modoAventura = false;
            document.getElementById('contenedor-aventura').style.display = 'none';
            document.getElementById('pantalla-enemigo').style.display = 'none';
            document.getElementById('contenedor-pueblo').style.display = 'block';
            // Opcional: Generar nuevo pueblo al volver, o mantener el mismo
             if(Math.random() > 0.8) generarPoblacion(); // 20% de probabilidad de viajar a otro
             renderPueblo();
        }

        function initMapa() {
            mundo.sectores = [];
            mundo.pos = { x: 1, y: 1 }; // Reset posición al centro
            for (let x = 0; x < mundo.dimension; x++) {
                mundo.sectores[x] = [];
                for (let y = 0; y < mundo.dimension; y++) {
                    mundo.sectores[x][y] = { 
                        revelado: (x === 1 && y === 1),
                        completado: false 
                    };
                }
            }
            renderMapa();
        }

        function renderMapa() {
            const grid = document.getElementById('mapa-grid');
            grid.innerHTML = "";
            for (let y = 0; y < mundo.dimension; y++) {
                for (let x = 0; x < mundo.dimension; x++) {
                    const s = mundo.sectores[x][y];
                    const div = document.createElement('div');
                    const esActual = (x === mundo.pos.x && y === mundo.pos.y);
                    div.className = `sector ${s.revelado ? 'revelado' : ''} ${esActual ? 'actual' : ''} ${s.completado ? 'completado' : ''}`;
                    
                    if (s.revelado) div.innerHTML = esActual ? "🛡️" : (s.completado ? "🌲" : "❓");
                    else div.innerHTML = "☁️"; // Niebla
                    
                    div.onclick = () => clicarSector(x, y);
                    grid.appendChild(div);
                }
            }
        }

        function clicarSector(x, y) {
            const dist = Math.abs(x - mundo.pos.x) + Math.abs(y - mundo.pos.y);
            if (x === mundo.pos.x && y === mundo.pos.y) {
                if (!mundo.sectores[x][y].completado) mostrarCombate();
                return;
            }
            if (dist === 1) {
                mundo.pos = { x, y };
                mundo.sectores[x][y].revelado = true;
                renderMapa();
            }
        }

        function mostrarCombate() {
            document.getElementById('contenedor-aventura').style.display = 'none';
            document.getElementById('pantalla-enemigo').style.display = 'block';
            generarEncuentro(); 
        }

        function cerrarCombate() {
            document.getElementById('pantalla-enemigo').style.display = 'none';
            document.getElementById('contenedor-aventura').style.display = 'block';
            renderMapa();
        }

        function generarEncuentro() {
            actual = enemigos[Math.floor(Math.random() * enemigos.length)];
            document.getElementById('enemigo-nombre').innerText = actual.n;
            document.getElementById('enemigo-hp').innerText = actual.hp;
            document.getElementById('enemigo-img').src = getPath(actual);
            document.getElementById('btn-derrota').style.display = 'inline-block';
            document.getElementById('botin-texto').innerHTML = "";
        }

        function derrotarEnemigo() {
            if (inventario.length >= calcularCapacidadMax()) { alert("¡Mochila llena!"); return; }
            
            const nivelMax = jerarquiaRareza[actual.LootTable] || 0;
            const posibles = Object.values(itemsDB).filter(it => (jerarquiaRareza[it.Rareza] || 0) <= nivelMax);
            
            if (posibles.length > 0) {
                const itemObtenido = { ...posibles[Math.floor(Math.random() * posibles.length)] };
                inventario.push(itemObtenido);
                localStorage.setItem('hq_inv', JSON.stringify(inventario));
                
                const color = coloresRareza[itemObtenido.Rareza];
                document.getElementById('botin-texto').innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
                        <span style="color:#fbbf24; font-size:12px">BOTÍN OBTENIDO</span>
                        <img src="${getPath(itemObtenido)}" style="width:60px; border:2px solid ${color}; border-radius:8px; background:#000">
                        <span style="color:${color}; font-size:18px">${itemObtenido.n}</span>
                    </div>`;
                document.getElementById('btn-derrota').style.display = 'none';
                mundo.sectores[mundo.pos.x][mundo.pos.y].completado = true;
            }
        }

        // --- SISTEMA DE GESTIÓN (IGUAL QUE ANTES) ---
        function cambiarVista(donde) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-view'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vista-' + donde).classList.add('active-view');
            document.getElementById('btn-nav-' + donde).classList.add('active');
            
            if(donde === 'mundo') {
                if(modoAventura) {
                    document.getElementById('contenedor-pueblo').style.display = 'none';
                    document.getElementById('contenedor-aventura').style.display = 'block';
                } else {
                    document.getElementById('contenedor-pueblo').style.display = 'block';
                    document.getElementById('contenedor-aventura').style.display = 'none';
                    renderPueblo();
                }
            }
            if(donde === 'mochila') renderInv();
            if(donde === 'heroe') renderEquipado();
        }

        function calcularCapacidadMax() {
            let total = 16;
            for (let i = 2; i <= 5; i++) {
                const b = equipado[`slot-bolsa-${i}`];
                if (b && b.espacios) total += b.espacios;
            }
            return total;
        }

        function renderEquipado() {
            document.querySelectorAll('.slot').forEach(s => {
                if(s.id !== 'slot-bolsa-1') { s.innerHTML = ""; s.style.borderColor = "#475569"; }
            });
            const s1 = document.getElementById('slot-bolsa-1');
            if(s1) {
                s1.innerHTML = `<img src="img/equipacion/mochila.jpg" style="opacity:0.6">`;
                s1.style.borderColor = coloresRareza["Common"];
            }
            for (const slotId in equipado) {
                const item = equipado[slotId];
                const target = document.getElementById(slotId);
                if (target && item) {
                    target.innerHTML = `<img src="${getPath(item)}">`;
                    target.style.borderColor = coloresRareza[item.Rareza] || "#475569";
                }
            }
        }

        function renderInv() {
            const div = document.getElementById('lista-inv');
            const max = calcularCapacidadMax();
            div.innerHTML = `<p style="grid-column: 1/-1; color:#94a3b8; font-size:13px">Carga: ${inventario.length} / ${max}</p>`;
            inventario.forEach((item, i) => {
                const color = coloresRareza[item.Rareza] || "#fff";
                div.innerHTML += `
                    <div class="item-slot" onclick="gestionarItem(${i})">
                        <img src="${getPath(item)}">
                        <span class="item-name" style="color:${color}">${item.n}</span>
                    </div>`;
            });
        }

        function gestionarItem(index) {
            const item = inventario[index];
            if (item.Tipo === "Equipable") {
                if (confirm(`Equipar ${item.n}?`)) equipar(index);
            } else {
                if (confirm(`Usar/Tirar ${item.n}?`)) {
                    inventario.splice(index, 1);
                    localStorage.setItem('hq_inv', JSON.stringify(inventario));
                    renderInv();
                }
            }
        }

        function equipar(index) {
            const nuevo = inventario[index];
            let slotId = "";
            if (nuevo.Slot === "bolsa") {
                for (let i = 2; i <= 5; i++) if (!equipado[`slot-bolsa-${i}`]) { slotId = `slot-bolsa-${i}`; break; }
                if (!slotId) slotId = "slot-bolsa-2";
            } else if (nuevo.Slot === "anillo") {
                slotId = !equipado["slot-anillo-1"] ? "slot-anillo-1" : "slot-anillo-2";
            } else {
                slotId = "slot-" + nuevo.Slot;
            }
            const actualEnSlot = equipado[slotId];
            if (actualEnSlot) {
                inventario[index] = { ...actualEnSlot };
                equipado[slotId] = { ...nuevo };
            } else {
                equipado[slotId] = { ...nuevo };
                inventario.splice(index, 1);
            }
            localStorage.setItem('hq_equipo', JSON.stringify(equipado));
            localStorage.setItem('hq_inv', JSON.stringify(inventario));
            renderInv(); renderEquipado();
        }

        function gestionarEquipado(el) {
            if (el.id === "slot-bolsa-1") return;
            const item = equipado[el.id];
            if (item && confirm(`Desequipar ${item.n}?`)) {
                if (inventario.length >= calcularCapacidadMax()) return;
                inventario.push({ ...item });
                delete equipado[el.id];
                localStorage.setItem('hq_inv', JSON.stringify(inventario));
                localStorage.setItem('hq_equipo', JSON.stringify(equipado));
                renderEquipado(); renderInv();
            }
        }

        function borrarTodo() { 
            if (confirm("Borrar todo?")) { 
                inventario = []; 
                localStorage.setItem('hq_inv', JSON.stringify(inventario)); 
                renderInv(); 
            } 
        }

        async function cargarDatos() {
            try {
                const v = Date.now();
                const [resEn, resEq, resCo, resBa] = await Promise.all([
                    fetch(`enemigos.json?v=${v}`).then(r => r.json()),
                    fetch(`equipacion.json?v=${v}`).then(r => r.json()),
                    fetch(`consumibles.json?v=${v}`).then(r => r.json()),
                    fetch(`basura.json?v=${v}`).then(r => r.json())
                ]);
                Object.values(resEq).forEach(it => it.subfolder = "equipacion");
                Object.values(resCo).forEach(it => it.subfolder = "consumibles");
                Object.values(resBa).forEach(it => it.subfolder = "basura");
                enemigos = Object.values(resEn);
                enemigos.forEach(en => en.subfolder = "enemigos");
                itemsDB = { ...resEq, ...resCo, ...resBa };
                
                // Inicialización
                if(!puebloActual) generarPoblacion();
                renderPueblo();
                renderEquipado();

            } catch (err) { console.error("Error cargando JSON:", err); }
        }

        cargarDatos();
    </script>
</body>
</html>
